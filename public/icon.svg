<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Korea field map">
  <!-- Drawn rather than exported: one file, no toolchain, and it stays crisp on a
       512px launcher and a 32px tab alike. The safe area for a maskable icon is the
       middle 80%, so everything that matters sits inside r=205 of the centre.
       An SVG in public/ cannot read styles/tokens.css, so these four are the trip's
       palette written out by hand — the night paper, its rules, and the accent.
       check-data.mjs fails if they stop matching the tokens. -->
  <rect width="512" height="512" rx="96" fill="#16171A"/>
  <g fill="none" stroke="#38393C" stroke-width="14" stroke-linecap="round">
    <path d="M96 300 L200 236 L316 296 L416 232"/>
    <path d="M96 380 L188 328 L300 380 L416 320"/>
  </g>
  <path d="M256 116c-49 0-88 39-88 88 0 62 76 140 84 148a6 6 0 0 0 8 0c8-8 84-86 84-148 0-49-39-88-88-88z" fill="#CBDC33"/>
  <circle cx="256" cy="204" r="33" fill="#16171A"/>
</svg>
