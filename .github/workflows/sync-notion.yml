name: Sync from Notion

# Pulls the Notion place database, rebuilds index.html, and commits if anything changed.
# GitHub Pages serves main from a branch, so the commit is the deploy.
on:
  schedule:
    # Every 6 hours, off the hour — the top of the hour is the most congested slot on
    # shared runners and scheduled jobs queue there.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the diff without committing"
        type: boolean
        default: true
      force:
        description: "Commit even if the pin count drops sharply (use after deleting rows in Notion)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch from Notion
        env:
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
        run: node scripts/sync-notion.mjs ${{ inputs.force && '--force' || '' }}

      - name: Rebuild index.html
        run: node scripts/build-page.mjs

      - name: Show the diff
        run: |
          if git diff --quiet; then
            echo "No changes." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git --no-pager diff --stat | tee -a "$GITHUB_STEP_SUMMARY"
          # The place lines are what a human actually wants to read.
          {
            echo '<details><summary>Changed places</summary>'
            echo
            echo '```diff'
            git --no-pager diff -U0 -- index.html | grep -E '^[+-]  \{ id:' | cut -c1-200 || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rebuilt page
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            index.html
            data/places.notion.json
          retention-days: 7

      - name: Commit
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.notion.json index.html
          git commit -m "Sync places from Notion

          Generated by .github/workflows/sync-notion.yml. Edit the Notion database, not
          index.html — scripts/build-page.mjs overwrites the generated block."
          git push

      - name: Say what a dry run would have done
        if: ${{ inputs.dry_run && github.event_name == 'workflow_dispatch' }}
        run: echo "Dry run — nothing committed. Re-run with dry_run unchecked to publish." | tee -a "$GITHUB_STEP_SUMMARY"
