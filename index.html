<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tim & Marisa · Korea — Seoul field map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />

<style>
  *{box-sizing:border-box;}
  :root{
    --paper:#F6F2EA; --surface:#FFFFFF; --ink:#1C1A17; --muted:#7A7062;
    --line:#E7E0D2; --line-2:#EFEAE0; --accent:#C8432A;
  }

  /* night mode */
  body.night{
    --paper:#15120D; --surface:#1E1A14; --ink:#F1EBDF; --muted:#9C9081;
    --line:#342E25; --line-2:#2A241D; --accent:#E2604A;
  }
  body.night #map{background:#0d0b08;}
  body.night .item:hover{background:#241f18;}
  body.night .item.sel{background:#2c2118;}
  body.night .leaflet-container{background:#0d0b08;}
  body.night .leaflet-popup-content-wrapper,
  body.night .leaflet-popup-tip{background:var(--surface); color:var(--ink);}
  body.night .leaflet-popup-content-wrapper{box-shadow:0 10px 30px rgba(0,0,0,.5);}
  body.night .leaflet-container a.leaflet-popup-close-button{color:var(--muted);}
  body.night .pop-note{color:var(--ink);}
  body.night .pop-hood{color:var(--muted);}
  body.night .leaflet-control-zoom a{background:var(--surface); color:var(--ink); border-color:var(--line);}
  body.night .soon-hi{background:#22304d; color:#9db4ea;}
  body.night .tilebanner{background:rgba(241,235,223,.92); color:#15120D;}

  .toolbtns{display:flex; align-items:center; gap:10px;}
  .nighttoggle{font-family:'Bricolage Grotesque',sans-serif; cursor:pointer; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); border-radius:7px; padding:5px 11px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; line-height:1;}
  .nighttoggle:hover{border-color:#cdbfa6;}
  body.night .nighttoggle:hover{border-color:#4a4234;}
  html,body{height:100%;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
  .disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;}

  .app{height:100vh; display:flex; flex-direction:column; overflow:hidden;}

  /* header */
  .head{padding:16px 22px 0; border-bottom:1px solid var(--line); flex:none;}
  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .titlerow{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:3px;}
  .title{font-size:27px; line-height:1.05; font-weight:700; letter-spacing:-.01em;}
  .title .amp{color:var(--accent);}
  .badge{font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12.5px; color:var(--accent);
    border:1.5px dashed var(--accent); border-radius:7px; padding:5px 11px; white-space:nowrap; background:rgba(200,67,42,.05);}
  .tabs{display:flex; gap:26px; margin-top:14px;}
  .tab{background:none; border:none; cursor:pointer; padding:0 0 12px; font-family:inherit; color:var(--muted); position:relative; text-align:left;}
  .tab-l{font-size:15px; font-weight:600; color:inherit; display:flex; align-items:center; gap:7px;}
  .tab-d{font-size:11.5px; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums;}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent); border-radius:3px;}
  .soon{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:2px 7px;}

  /* body */
  .body{flex:1; min-height:0; display:flex;}
  .side{width:340px; flex:none; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:0;}
  .mapwrap{flex:1; min-height:0; position:relative;}
  #map{position:absolute; inset:0; background:#e9e4da; z-index:0;}

  .sum{padding:15px 18px 13px; border-bottom:1px solid var(--line-2);}
  .sum-n{font-family:'Bricolage Grotesque',sans-serif; font-size:13px; font-weight:600;}
  .sum-n b{color:var(--accent);}
  .sum-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .legend{padding:12px 14px 13px; border-bottom:1px solid var(--line-2); display:flex; flex-wrap:wrap; gap:6px;}
  .chip{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; border:1px solid var(--line);
    background:var(--surface); border-radius:20px; padding:4px 10px 4px 7px; font-size:11.5px; font-weight:500; color:var(--ink); transition:.12s; line-height:1;}
  .chip:hover{border-color:#d9d0bf;}
  .chip.off{opacity:.4;}
  .dot{width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 2px #fff inset;}
  .chip .ct{color:var(--muted); font-variant-numeric:tabular-nums;}

  .list{overflow-y:auto; flex:1; min-height:0; padding:4px 0 14px;}
  .cluster{padding:14px 18px 4px;}
  .cluster-h{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px;}
  .cluster-h::after{content:''; flex:1; height:1px; background:var(--line-2);}
  .item{width:100%; text-align:left; background:none; border:none; cursor:pointer; color:var(--ink); font-family:inherit; display:flex; gap:10px; padding:8px 18px; border-left:3px solid transparent; align-items:flex-start;}
  .item:hover{background:#faf7f1;}
  .item.sel{background:#fbf1ed; border-left-color:var(--accent);}
  .pindot{width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; margin-top:1px; box-shadow:0 1px 2px rgba(0,0,0,.18);}
  .it-body{min-width:0; flex:1;}
  .it-name{font-size:13.5px; font-weight:600; line-height:1.2; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .it-note{font-size:11.5px; color:var(--muted); line-height:1.35; margin-top:2px;}
  .it-meta{font-size:10.5px; color:var(--accent); font-weight:600; margin-top:3px;}
  .tag{font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 4px; line-height:1.3;}

  /* pins */
  .pin{width:30px; height:30px;}
  .pin-b{width:30px; height:30px; background:var(--pin); border:2.5px solid #fff; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.32);}
  .pin-b span{transform:rotate(45deg); font-size:13px; line-height:1;}
  .pin.star .pin-b{box-shadow:0 0 0 2.5px #fff, 0 0 0 4.5px var(--pin), 0 2px 5px rgba(0,0,0,.32);}

  .leaflet-popup-content-wrapper{border-radius:11px; box-shadow:0 10px 30px rgba(28,26,23,.2); padding:2px;}
  .leaflet-popup-content{margin:12px 14px; font-family:'Inter',sans-serif; line-height:1.4;}
  .pop-cat{display:inline-flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .pop-name{font-family:'Bricolage Grotesque',sans-serif; font-size:16px; font-weight:700; margin:5px 0 1px;}
  .pop-hood{font-size:11px; color:#7A7062; margin-bottom:6px;}
  .pop-note{font-size:12.5px; color:#3a352e;}
  .pop-meta{font-size:11.5px; font-weight:600; color:#C8432A; margin-top:6px;}

  /* tile fallback banner */
  .tilebanner{position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:500; max-width:88%;
    background:rgba(28,26,23,.86); color:#F6F2EA; font-size:12px; line-height:1.4; padding:9px 14px; border-radius:9px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; text-align:center;}

  /* coming soon */
  .soonpane{flex:1; display:none; align-items:center; justify-content:center; padding:30px;}
  .soonpane.show{display:flex;}
  .soon-card{max-width:420px; text-align:center;}
  .soon-k{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .soon-t{font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:700; margin:6px 0 2px;}
  .soon-dt{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .soon-hotel{margin-top:22px; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:16px 18px; display:inline-flex; align-items:center; gap:12px; text-align:left;}
  .soon-hi{width:38px; height:38px; border-radius:9px; background:#eef0fb; color:#3949AB; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
  .soon-hk{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .soon-hn{font-size:15px; font-weight:600;}
  .soon-note{font-size:12.5px; color:var(--muted); margin-top:20px; line-height:1.5;}

  .railtoggle{font-family:'Bricolage Grotesque',sans-serif; cursor:pointer; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); border-radius:7px; padding:5px 11px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; line-height:1;}
  .railtoggle:hover{border-color:#cdbfa6;}
  .railtoggle.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  body.night .railtoggle:hover{border-color:#4a4234;}
  .raillegend{position:absolute; left:14px; bottom:14px; z-index:500; background:rgba(255,255,255,.94);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px 10px; box-shadow:0 4px 16px rgba(0,0,0,.13);
    max-width:210px; display:flex; flex-wrap:wrap; gap:5px 13px;}
  .raillegend .rl-h{flex-basis:100%; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:2px;}
  .rl-item{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); white-space:nowrap;}
  .rl-bar{width:15px; height:4px; border-radius:2px; flex:none;}
  body.night .raillegend{background:rgba(30,26,20,.93);}

  .pop-route{margin-top:8px; padding-top:7px; border-top:1px solid var(--line-2); font-size:11.5px; line-height:1.75;}
  .pr-k{font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-right:5px;}
  .pr-line{display:inline-block; color:#fff; font-weight:700; font-size:10px; padding:1px 6px; border-radius:5px; white-space:nowrap; vertical-align:middle;}
  .pr-to{color:var(--muted); font-weight:500;}
  .pr-off{font-weight:700; color:var(--ink);}
  .pr-arr{color:var(--muted);}
  .leaflet-tooltip.rs-tip{background:rgba(255,255,255,.94); border:none; box-shadow:0 1px 5px rgba(0,0,0,.22); font-size:10.5px; font-weight:600; color:#1C1A17; padding:1px 7px; border-radius:6px;}
  .leaflet-tooltip.rs-tip.off{font-weight:800;}
  .leaflet-tooltip.rs-tip::before{display:none;}
  body.night .leaflet-tooltip.rs-tip{background:rgba(30,26,20,.95); color:#F1EBDF;}

  @media (max-width:780px){
    .app{height:auto; min-height:100vh; overflow:visible;}
    .body{flex-direction:column;}
    .side{width:100%; border-right:none; border-bottom:1px solid var(--line); order:2;}
    .mapwrap{height:60vh; flex:none; order:1;}
    .tabs{gap:18px;}
  }
</style>
</head>

<body class="night">
<div class="app">
  <header class="head">
    <div class="eyebrow">Food-first field map</div>
    <div class="titlerow">
      <div class="title disp">Tim <span class="amp">&amp;</span> Marisa · Korea</div>
      <div class="toolbtns">
        <button class="railtoggle on" id="railToggle" title="Toggle subway lines">🚇 Rail</button>
        <button class="nighttoggle" id="nightToggle" title="Toggle night mode">☀️ Day</button>
        <div class="badge">AUG 29 — SEP 12 · 2026</div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="body">
    <aside class="side" id="side">
      <div class="sum">
        <div class="sum-n"><b id="shownCount">40</b> spots · <span id="hoodCount">10</span> neighborhoods</div>
        <div class="sum-sub"><span id="bookedCount">3</span> booked · ⭐ = reserved · tap to fly there</div>

      <div class="legend" id="legend"></div>

    </aside>

    <div class="mapwrap" id="mapwrap">
      <div id="map"></div>
      <div class="tilebanner" id="tilebanner"></div>
      <div class="raillegend" id="raillegend"></div>
    </div>

    <div class="soonpane" id="soonpane"></div>
  </div>
</div>

const RAIL = { seoul: SUBWAY, busan: SUBWAY_BUSAN, jeju: [] };

let currentTab = "seoul";
const markers = {};
let map;
let night = true, baseLayer = null, tilesOk = false;
let railLayer = null, railOn = true;
let routeLayer = null;

/* ---------------- build tabs ---------------- */
const tabsEl = document.getElementById("tabs");
LEGS.forEach(leg => {
  const b = document.createElement("button");
  b.className = "tab" + (leg.id === "seoul" ? " active" : "");
  b.dataset.tab = leg.id;
  b.innerHTML = `<span class="tab-l">${leg.label}</span>
                 <span class="tab-d">${leg.dates}</span>`;
  b.onclick = () => setTab(leg.id);
  tabsEl.appendChild(b);
});

/* ---------------- legend ---------------- */
let counts = {};
function computeCounts(){ counts = {}; CAT_ORDER.forEach(k => counts[k] = 0); PLACES.forEach(p => { if (p.city === currentTab) counts[p.cat]++; }); }
computeCounts();
const legendEl = document.getElementById("legend");
function renderLegend(){
  computeCounts();
  legendEl.innerHTML = "";
  CAT_ORDER.forEach(k => {
    const c = CATS[k];
    const b = document.createElement("button");
    b.className = "chip" + (active[k] ? "" : " off");
    b.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}<span class="ct">${counts[k]}</span>`;
    b.onclick = () => { active[k] = !active[k]; syncMarkers(); renderLegend(); renderList(); };
    legendEl.appendChild(b);
  });
  if (CAT_ORDER.some(k => !active[k])) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = "Show all";
    b.onclick = () => { CAT_ORDER.forEach(k => active[k] = true); syncMarkers(); renderLegend(); renderList(); };
    legendEl.appendChild(b);
  }
}

/* ---------------- sidebar list ---------------- */
const listEl = document.getElementById("list");
function renderList(){
  listEl.innerHTML = "";
  let hoods = 0, shown = 0;
  (CLUSTERS[currentTab] || []).forEach(cl => {
    const items = PLACES.filter(p => p.city === currentTab && p.cluster === cl && active[p.cat]);
    if (!items.length) return;
    hoods++; shown += items.length;
    const head = document.createElement("div");
    head.className = "cluster";
    head.innerHTML = `<div class="cluster-h">${cl}</div>`;
    listEl.appendChild(head);
    items.forEach(p => {
      const c = CATS[p.cat];
      const b = document.createElement("button");
      b.className = "item" + (selectedId === p.id ? " sel" : "");
      b.dataset.id = p.id;
      b.innerHTML = `<span class="pindot" style="background:${c.color}">${c.emoji}</span>
        <span class="it-body">
          <span class="it-name">${p.name}${p.added ? '<span class="tag">new</span>' : ""}</span>
          <span class="it-note">${p.note}</span>
          ${p.meta ? `<span class="it-meta">${p.meta}</span>` : ""}
        </span>`;
      b.onclick = () => focus(p.id);
      listEl.appendChild(b);
    });
  });
  document.getElementById("shownCount").textContent = shown;
  document.getElementById("hoodCount").textContent = hoods;
  const bc = document.getElementById("bookedCount");
  if (bc) bc.textContent = PLACES.filter(p => p.city === currentTab && p.booked).length;
}

function highlightList(){
  listEl.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("sel", el.dataset.id === selectedId));
}

/* ---------------- map ---------------- */
function popupHtml(p){
  const c = CATS[p.cat];
  return `<div class="pop-cat" style="color:${c.color}">${c.emoji} ${c.label}</div>
    <div class="pop-name">${p.name}</div>
    <div class="pop-hood">${p.cluster}</div>
    <div class="pop-note">${p.note}</div>
    ${p.meta ? `<div class="pop-meta">${p.meta}</div>` : ""}${routeStripHtml(p)}`;
}

function drawRail(){
  if (!railLayer || !window.L) return;
  railLayer.clearLayers();
  const casing = night ? "#15120D" : "#ffffff";
  (RAIL[currentTab]||[]).forEach(function(ln){ ln.paths.forEach(function(pa){
    L.polyline(pa, { color: casing, weight: 6, opacity: 0.5, lineCap: "round", lineJoin: "round", interactive: false }).addTo(railLayer);
  }); });
  (RAIL[currentTab]||[]).forEach(function(ln){ ln.paths.forEach(function(pa){
    L.polyline(pa, { color: ln.color, weight: 3, opacity: 0.92, lineCap: "round", lineJoin: "round", interactive: false }).addTo(railLayer);
  }); });
}

function setBaseLayer(){
  if (!map) return;
  if (baseLayer) map.removeLayer(baseLayer);
  const style = night ? "dark_all" : "light_all";
  baseLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
    attribution: "© OpenStreetMap © CARTO", subdomains: "abcd", maxZoom: 20,
  });
  baseLayer.on("load", () => { tilesOk = true; document.getElementById("tilebanner").style.display = "none"; });
  baseLayer.addTo(map);
}

function lineMeta(ref){ return (typeof SUBWAY!=="undefined" && SUBWAY.find(l=>l.ref===ref)) || {label:"Line "+ref, color:"#888"}; }
function routeStripHtml(p){
  const off = (typeof PLACE_OFF!=="undefined") ? PLACE_OFF[p.id] : null;
  if (!off || !ROUTES[off]) return "";
  const legs = ROUTES[off];
  const parts = legs.map((leg,i) => {
    const m = lineMeta(leg.line);
    const chip = `<span class="pr-line" style="background:${m.color}">${m.label}</span>`;
    return (i===legs.length-1) ? `${chip} <span class="pr-off">off at ${leg.to}</span>`
                               : `${chip} <span class="pr-to">${leg.to}</span> <span class="pr-arr">\u2192</span>`;
  });
  return `<div class="pop-route"><span class="pr-k">From hotel</span> ${parts.join(" ")}</div>`;
}
function cssVar(v){ return getComputedStyle(document.body).getPropertyValue(v).trim() || "#C8432A"; }
function showRoute(p){
  if (!routeLayer) return;
  routeLayer.clearLayers();
  const off = PLACE_OFF[p.id]; if (!off || !ROUTES[off]) return;
  const seq = [{ name: HOTEL_STATION, kind: "board" }];
  ROUTES[off].forEach((leg,i) => seq.push({ name: leg.to, kind: i===ROUTES[off].length-1 ? "off" : "transfer" }));
  seq.forEach(s => {
    const c = STATION_COORDS[s.name]; if (!c) return;
    const fill = s.kind==="off" ? cssVar("--accent") : s.kind==="board" ? "#3949AB" : "#7A7062";
    const dot = L.circleMarker(c, { radius: s.kind==="off"?7:5, color:"#fff", weight:2.5, fillColor:fill, fillOpacity:1, interactive:false }).addTo(routeLayer);
    dot.bindTooltip(s.name, { permanent:true, direction:"right", className:"rs-tip "+s.kind, offset:[7,0] });
  });
}
function clearRoute(){ if (routeLayer) routeLayer.clearLayers(); }

function fitCity(){
  const pts = PLACES.filter(p => p.city === currentTab).map(p => [p.lat, p.lng]);
  if (pts.length && map) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50] });
}
function initMap(){
  map = L.map("map", { scrollWheelZoom: true }).setView([37.5535, 126.9905], 12);

  setBaseLayer();

  railLayer = L.layerGroup();
  if (railOn) railLayer.addTo(map);
  drawRail();
  routeLayer = L.layerGroup().addTo(map);

  PLACES.forEach(p => {
    const c = CATS[p.cat];
    const icon = L.divIcon({
      className: "",
      html: `<div class="pin ${p.booked ? "star" : ""}" style="--pin:${c.color}">
               <div class="pin-b"><span>${c.emoji}</span></div></div>`,
      iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28],
    });
    const m = L.marker([p.lat, p.lng], { icon }).bindPopup(popupHtml(p));
    m.on("popupopen", () => { selectedId = p.id; highlightList(); showRoute(p); });
    m.on("popupclose", () => { clearRoute(); if (selectedId === p.id) { selectedId = null; highlightList(); } });
    markers[p.id] = m;
    if (p.city === currentTab) m.addTo(map);
  });

  fitCity();

  // if no tiles loaded after a few seconds, explain (pins still work on the gray canvas)
  setTimeout(() => {
    if (!tilesOk) {
      const b = document.getElementById("tilebanner");
      b.textContent = "Live map tiles are blocked in this preview — open this file in a browser to see the full street map. The pins below work either way.";
      b.style.display = "block";
    }
  }, 3500);
}

function syncMarkers(){
  if (!map) return;
  PLACES.forEach(p => {
    const m = markers[p.id]; if (!m) return;
    if (p.city === currentTab && active[p.cat]) { if (!map.hasLayer(m)) m.addTo(map); }
    else { if (map.hasLayer(m)) map.removeLayer(m); }
  });
}

function focus(id){
  const p = PLACES.find(x => x.id === id); if (!p) return;
  selectedId = id; highlightList();
  if (map && markers[id]) {
    map.flyTo([p.lat, p.lng], 16, { duration: 0.7 });
    markers[id].openPopup();
  }
}

/* ---------------- tabs ---------------- */
function setTab(id){
  currentTab = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === id));
  selectedId = null;
  clearRoute();
  renderLegend();
  renderList();
  drawRail();
  renderRailLegend();
  const hasRail = (RAIL[id] || []).length > 0;
  const rt = document.getElementById("railToggle");
  const rl = document.getElementById("raillegend");
  if (rt) rt.style.display = hasRail ? "" : "none";
  if (rl) rl.style.display = (hasRail && railOn) ? "" : "none";
  if (map) {
    syncMarkers();
    fitCity();
    setTimeout(() => map && map.invalidateSize(), 60);
  }
}

/* ---------------- go ---------------- */
renderLegend();
renderList();

const nightBtn = document.getElementById("nightToggle");
if (nightBtn) nightBtn.onclick = () => {
  night = !night;
  document.body.classList.toggle("night", night);
  nightBtn.textContent = night ? "☀️ Day" : "🌙 Night";
  setBaseLayer();
  drawRail();
};

const railBtn = document.getElementById("railToggle");
if (railBtn) railBtn.onclick = () => {
  railOn = !railOn;
  railBtn.classList.toggle("on", railOn);
  if (map && railLayer) { railOn ? railLayer.addTo(map) : map.removeLayer(railLayer); }
  const rl = document.getElementById("raillegend"); if (rl) rl.style.display = railOn ? "" : "none";
};
function renderRailLegend(){
  const el = document.getElementById("raillegend"); if (!el) return;
  el.innerHTML = '<div class="rl-h">Subway</div>' + (RAIL[currentTab]||[]).map(ln =>
    `<span class="rl-item"><span class="rl-bar" style="background:${ln.color}"></span>${ln.label}</span>`).join("");
}
renderRailLegend();

function libFail(){
  const b = document.getElementById("tilebanner");
  b.textContent = "The live map can’t load in this preview right now — download this file and open it in any browser, where it works reliably.";
  b.style.display = "block";
}
function bootMap(){
  if (window.L) { initMap(); return; }
  // primary CDN didn't load this render — retry from a fallback source
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(link);
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";
  s.onload = () => { window.L ? initMap() : libFail(); };
  s.onerror = libFail;
  document.body.appendChild(s);
}
bootMap();
</script>
</body>
</html>
