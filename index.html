<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#15120D" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)" />
<title>Tim & Marisa · Korea — Seoul field map</title>

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />

<style>
  /* Fonts live in vendor/ so the page needs nothing from Google to render.
     Both are variable (weight axis), so one file per subset covers every weight used.
     The -ext subsets exist for ₩ and friends; browsers skip them unless a glyph needs them. */
  @font-face{font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:swap;
    src:url(vendor/fonts/inter-latin-wght-normal.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:swap;
    src:url(vendor/fonts/inter-latin-ext-wght-normal.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'Bricolage Grotesque'; font-style:normal; font-weight:200 800; font-display:swap;
    src:url(vendor/fonts/bricolage-grotesque-latin-wght-normal.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Bricolage Grotesque'; font-style:normal; font-weight:200 800; font-display:swap;
    src:url(vendor/fonts/bricolage-grotesque-latin-ext-wght-normal.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

  *{box-sizing:border-box;}
  :root{
    --paper:#F6F2EA; --surface:#FFFFFF; --ink:#1C1A17; --muted:#7A7062;
    --line:#E7E0D2; --line-2:#EFEAE0; --accent:#C8432A;
    /* An input has to read as inset, so it is off --surface rather than on it; and a
       plan that saves you a kilometre wants a colour that isn't the warning red. */
    --field:#FBF8F2; --ok:#2E7D52; --warn:#9C5A16;
  }

  /* night mode */
  body.night{
    --paper:#15120D; --surface:#1E1A14; --ink:#F1EBDF; --muted:#9C9081;
    --line:#342E25; --line-2:#2A241D; --accent:#E2604A;
    --field:#161310; --ok:#5FBE8B; --warn:#D9A05B;
  }
  body.night #map{background:#0d0b08;}
  body.night .item:hover{background:#241f18;}
  body.night .item.sel{background:#2c2118;}
  body.night .leaflet-container{background:#0d0b08;}
  body.night .card{box-shadow:0 14px 36px rgba(0,0,0,.55);}
  body.night .leaflet-control-zoom a{background:var(--surface); color:var(--ink); border-color:var(--line);}
  body.night .tilebanner{background:rgba(241,235,223,.92); color:#15120D;}
  body.carded .tilebanner{top:auto; bottom:14px;}

  .toolbtns{display:flex; align-items:center; gap:10px;}
  .nighttoggle{font-family:'Bricolage Grotesque',sans-serif; cursor:pointer; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); border-radius:7px; padding:5px 11px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; line-height:1;}
  .nighttoggle:hover{border-color:#cdbfa6;}
  body.night .nighttoggle:hover{border-color:#4a4234;}
  html,body{height:100%;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
  .disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;}

  .app{height:100vh; display:flex; flex-direction:column; overflow:hidden;}

  /* header */
  .head{padding:16px 22px 0; border-bottom:1px solid var(--line); flex:none;}
  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .titlerow{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:3px;}
  .title{font-size:27px; line-height:1.05; font-weight:700; letter-spacing:-.01em;}
  .title .amp{color:var(--accent);}
  .badge{font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12.5px; color:var(--accent);
    border:1.5px dashed var(--accent); border-radius:7px; padding:5px 11px; white-space:nowrap; background:rgba(200,67,42,.05);}
  .tabs{display:flex; gap:26px; margin-top:14px;}
  .tab{background:none; border:none; cursor:pointer; padding:0 0 12px; font-family:inherit; color:var(--muted); position:relative; text-align:left;}
  .tab-l{font-size:15px; font-weight:600; color:inherit; display:flex; align-items:center; gap:7px;}
  .tab-d{font-size:11.5px; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums;}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent); border-radius:3px;}

  /* body */
  .body{flex:1; min-height:0; display:flex;}
  .side{width:340px; flex:none; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:0;}
  .mapwrap{flex:1; min-height:0; position:relative;}
  #map{position:absolute; inset:0; background:#e9e4da; z-index:0;}

  .sum{padding:15px 18px 13px; border-bottom:1px solid var(--line-2);}
  .sum-n{font-family:'Bricolage Grotesque',sans-serif; font-size:13px; font-weight:600;}
  .sum-n b{color:var(--accent);}
  .sum-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .legend{padding:12px 14px 13px; border-bottom:1px solid var(--line-2); display:flex; flex-wrap:wrap; gap:6px;}
  .chip{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; border:1px solid var(--line);
    background:var(--surface); border-radius:20px; padding:4px 10px 4px 7px; font-size:11.5px; font-weight:500; color:var(--ink); transition:.12s; line-height:1;}
  .chip:hover{border-color:#d9d0bf;}
  .chip.off{opacity:.4;}
  .dot{width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 2px #fff inset;}
  .chip .ct{color:var(--muted); font-variant-numeric:tabular-nums;}

  .list{overflow-y:auto; flex:1; min-height:0; padding:4px 0 14px;}
  .cluster{padding:14px 18px 4px;}
  .cluster-h{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px;}
  .cluster-h::after{content:''; flex:1; height:1px; background:var(--line-2);}
  .item{width:100%; text-align:left; background:none; border:none; cursor:pointer; color:var(--ink); font-family:inherit; display:flex; gap:10px; padding:8px 18px; border-left:3px solid transparent; align-items:flex-start;}
  .item:hover{background:#faf7f1;}
  .item.sel{background:#fbf1ed; border-left-color:var(--accent);}
  .pindot{width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; margin-top:1px; box-shadow:0 1px 2px rgba(0,0,0,.18);}
  .it-body{min-width:0; flex:1;}
  .it-name{font-size:13.5px; font-weight:600; line-height:1.2; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .it-note{font-size:11.5px; color:var(--muted); line-height:1.35; margin-top:2px;}
  .it-meta{font-size:10.5px; color:var(--accent); font-weight:600; margin-top:3px;}
  .tag{font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 4px; line-height:1.3;}

  /* pins */
  .pin{width:30px; height:30px;}
  .pin-b{width:30px; height:30px; background:var(--pin); border:2.5px solid #fff; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.32);}
  .pin-b span{transform:rotate(45deg); font-size:13px; line-height:1;}
  .pin-n{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:14px; color:#fff;}
  /* With a day up, the day is the subject and the other seventy-odd spots are context. */
  body.planning .leaflet-marker-icon{opacity:.26; transition:opacity .18s;}
  body.planning .leaflet-marker-icon:hover{opacity:1;}
  body.planning .leaflet-marker-icon.mk-plan{opacity:1;}
  .pin.plan .pin-b{border-width:3px; box-shadow:0 3px 9px rgba(0,0,0,.45);}

  /* The place card sits at the top of the map rather than on a pin, so the ride
     below it is never underneath it and the map can be dragged out from under it. */
  .card{position:absolute; top:14px; right:14px; z-index:600; width:332px; max-width:calc(100% - 28px);
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 14px 36px rgba(28,26,23,.18); padding:13px 16px 14px; line-height:1.4; display:none;}
  .card.show{display:block; animation:cardIn .2s ease-out;}
  @keyframes cardIn{from{opacity:0; transform:translateY(-9px);} to{opacity:1; transform:none;}}
  .card-x{position:absolute; top:7px; right:7px; width:28px; height:28px; border:none; background:none;
    cursor:pointer; color:var(--muted); font-size:16px; line-height:1; border-radius:7px; padding:0;}
  .card-x:hover{background:var(--line-2); color:var(--ink);}
  .pop-cat{display:inline-flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .pop-name{font-family:'Bricolage Grotesque',sans-serif; font-size:16px; font-weight:700; margin:5px 0 1px; padding-right:22px;}
  .pop-hood{font-size:11px; color:var(--muted); margin-bottom:6px;}
  .pop-note{font-size:12.5px; color:var(--ink);}
  .pop-meta{font-size:11.5px; font-weight:600; color:var(--accent); margin-top:6px;}
  .card-plan{margin-top:10px;}

  /* tile fallback banner */
  .tilebanner{position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:500; max-width:88%;
    background:rgba(28,26,23,.86); color:#F6F2EA; font-size:12px; line-height:1.4; padding:9px 14px; border-radius:9px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); display:none; text-align:center;}


  /* ---- day planner ---- */
  /* Places and Plan are two panes of the same sidebar, not a third column: that way
     the mobile map/list swap below already covers the planner with no new rules. */
  .sidetabs{display:flex; gap:4px; padding:9px 12px 0;}
  .sidetab{flex:1; border:none; background:none; cursor:pointer; font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600; font-size:13px; color:var(--muted); padding:8px 6px; border-radius:8px 8px 0 0;
    display:flex; align-items:center; justify-content:center; gap:6px; line-height:1; border-bottom:2px solid transparent;}
  .sidetab:hover{color:var(--ink);}
  .sidetab.on{color:var(--ink); border-bottom-color:var(--accent);}
  .st-ct{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .sidetab.on .st-ct{color:var(--accent);}

  #side[data-sidetab="plan"] .sum,
  #side[data-sidetab="plan"] .searchwrap,
  #side[data-sidetab="plan"] .legend,
  #side[data-sidetab="plan"] .list{display:none;}
  #side[data-sidetab="places"] .planpane{display:none;}

  /* The search box lives outside #list on purpose — renderList() empties #list on
     every keystroke, and an input inside it would lose focus mid-word. */
  .searchwrap{padding:11px 14px 0; position:relative;}
  .searchbox{width:100%; font-family:inherit; font-size:13px; color:var(--ink); background:var(--field);
    border:1px solid var(--line); border-radius:9px; padding:8px 30px 8px 11px; line-height:1.2; -webkit-appearance:none;}
  .searchbox::placeholder{color:var(--muted);}
  .searchbox::-webkit-search-decoration,.searchbox::-webkit-search-cancel-button{-webkit-appearance:none;}
  .searchbox:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--line-2);}
  .searchclear{position:absolute; right:19px; top:50%; transform:translateY(-50%); border:none; background:none;
    cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:4px 6px; border-radius:6px; display:none;}
  .searchclear.on{display:block;}
  .searchclear:hover{color:var(--ink); background:var(--line-2);}

  /* a row is a button, so the add control has to be its sibling, never its child */
  .itemrow{display:flex; align-items:flex-start;}
  .itemrow .item{flex:1; min-width:0;}
  .planbtn{flex:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer;
    font-family:inherit; font-size:14px; line-height:1; width:26px; height:26px; border-radius:8px; margin:9px 12px 0 0;
    display:flex; align-items:center; justify-content:center; padding:0;}
  .planbtn:hover{border-color:var(--accent); color:var(--accent);}
  .planbtn.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .planbtn.on:hover{background:var(--accent); border-color:var(--accent); color:#fff;}

  .planpane{flex:1; min-height:0; overflow-y:auto; padding:2px 0 16px;}
  .phead{padding:12px 16px 10px; border-bottom:1px solid var(--line-2); display:flex; flex-direction:column; gap:7px;}
  .ptitle{width:100%; font-family:'Bricolage Grotesque',sans-serif; font-size:15px; font-weight:700; color:var(--ink);
    background:var(--field); border:1px solid var(--line); border-radius:8px; padding:7px 10px; -webkit-appearance:none;}
  .ptitle:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--line-2);}
  .pdate{font-family:inherit; font-size:12px; color:var(--ink); background:var(--field); border:1px solid var(--line);
    border-radius:8px; padding:6px 9px; -webkit-appearance:none;}
  .pdate:focus{outline:none; border-color:var(--accent);}
  .pmeta{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .pmeta b{color:var(--accent);}

  .pstop{display:flex; gap:9px; align-items:flex-start; padding:9px 14px 9px 10px;}
  .pstop.dragging{opacity:.5;}
  .pstop.dropbefore{box-shadow:inset 0 2px 0 var(--accent);}
  .pdrag{flex:none; border:none; background:none; color:var(--muted); cursor:grab; font-size:13px; line-height:1;
    padding:6px 2px; border-radius:6px; touch-action:none;}
  .pdrag:active{cursor:grabbing;}
  .pnum-i{flex:none; width:21px; height:21px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:#fff; margin-top:1px; box-shadow:0 1px 2px rgba(0,0,0,.2);
    font-variant-numeric:tabular-nums;}
  .pbody{flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; cursor:pointer;
    color:var(--ink); font-family:inherit; display:block;}
  .pname{display:block; font-size:13.5px; font-weight:600; line-height:1.25;}
  .phood{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .pnote{display:block; font-size:11.5px; color:var(--muted); line-height:1.35; margin-top:2px;}
  .pmetaline{display:block; font-size:10.5px; color:var(--accent); font-weight:600; margin-top:3px;}
  .pstop.gone .pname{color:var(--muted); font-style:italic;}
  .pctrl{flex:none; display:flex; flex-direction:column; gap:2px;}
  .pmove{border:none; background:none; color:var(--muted); cursor:pointer; font-size:9px; line-height:1;
    padding:3px 5px; border-radius:5px;}
  .pmove:hover:not(:disabled){color:var(--ink); background:var(--line-2);}
  .pmove:disabled{opacity:.25; cursor:default;}
  .pdrop{border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px; line-height:1;
    padding:3px 5px; border-radius:5px;}
  .pdrop:hover{color:var(--accent); background:var(--line-2);}

  /* The hop between two stops. There is no rail time here on purpose — see naverDirUrl. */
  .phop{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:2px 14px 6px 40px; font-size:11px; color:var(--muted);
    font-variant-numeric:tabular-nums;}
  .phop-r{width:1px; height:11px; background:var(--line); margin-left:-14px;}
  .phop-a{color:var(--accent); text-decoration:none; font-weight:600; border:1px solid var(--line);
    border-radius:20px; padding:2px 8px;}
  .phop-l{color:#fff; background:var(--ln); font-weight:700; border-radius:20px; padding:2px 8px; font-size:10px;}
  .phop-s{color:var(--muted);}
  .phop-a:hover{border-color:var(--accent);}

  .pcaution{margin:8px 14px; border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px;
    background:var(--field); padding:8px 10px; font-size:11.5px; line-height:1.4; color:var(--ink);}
  .pcaution.closed{border-left-color:var(--accent);}
  .pcaution-fix{margin-top:6px; border:1px solid var(--ok); background:none; color:var(--ok); cursor:pointer;
    font-family:inherit; font-size:11px; font-weight:600; border-radius:20px; padding:3px 10px;}
  .pcaution-fix:hover{background:var(--ok); color:#fff;}

  .psec{padding:14px 16px 4px;}
  .psec-h{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:8px;}
  .psec-h::after{content:''; flex:1; height:1px; background:var(--line-2);}
  .psug{display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left; background:none; border:none;
    cursor:pointer; color:var(--ink); font-family:inherit; padding:7px 16px;}
  .psug:hover{background:var(--field);}
  .psug .pindot{margin-top:1px;}
  .psug .it-note,.psug-d{display:block;}
  .psug-d{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:2px;}
  .pempty{padding:22px 20px; color:var(--muted); font-size:12.5px; line-height:1.5; text-align:center;}
  .pacts{display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 4px;}
  .pact{border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit;
    font-size:11.5px; font-weight:500; border-radius:20px; padding:6px 11px; line-height:1;}
  .pact:hover{border-color:var(--accent); color:var(--accent);}
  .pact.done{border-color:var(--ok); color:var(--ok);}


  .railtoggle{font-family:'Bricolage Grotesque',sans-serif; cursor:pointer; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); border-radius:7px; padding:5px 11px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; line-height:1;}
  .railtoggle:hover{border-color:#cdbfa6;}
  .railtoggle.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  body.night .railtoggle:hover{border-color:#4a4234;}
  .raillegend{position:absolute; left:14px; bottom:14px; z-index:500; background:rgba(255,255,255,.94);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px 10px; box-shadow:0 4px 16px rgba(0,0,0,.13);
    max-width:210px; display:flex; flex-wrap:wrap; gap:5px 13px;}
  .raillegend .rl-h{flex-basis:100%; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:2px;}
  .rl-item{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); white-space:nowrap;}
  .rl-bar{width:15px; height:4px; border-radius:2px; flex:none;}
  body.night .raillegend{background:rgba(30,26,20,.93);}

  /* the ride from the hotel, as printed in the popup */
  .pop-route{margin-top:9px; padding-top:8px; border-top:1px solid var(--line-2); font-size:11.5px;}
  .pr-k{display:block; font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .pr-step{display:flex; align-items:baseline; gap:7px; line-height:1.6;}
  .pr-line{display:inline-block; color:#fff; font-weight:700; font-size:10px; padding:1px 6px; border-radius:5px; white-space:nowrap;}
  .pr-to{font-weight:700; color:var(--ink);}
  .pr-off{font-weight:800; color:var(--accent);}
  .pr-arr{color:var(--muted);}
  .pr-tag{font-size:8.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:700; color:var(--muted);

  .rs-tip.off .rs-k{opacity:1; color:var(--accent);}
  body.night .leaflet-tooltip.rs-tip{background:rgba(30,26,20,.95); color:#F1EBDF;}
  /* a soft pulse under the drawn ride — opacity only, so the blur layer is painted once */
  @keyframes rsGlow{0%,100%{opacity:.15;} 50%{opacity:.45;}}
  @keyframes rsGlowDay{0%,100%{opacity:.2;} 50%{opacity:.6;}}
  .rs-glow{filter:blur(3px); animation:rsGlow 2.6s ease-in-out infinite;}

  body:not(.night) .rs-glow{animation-name:rsGlowDay;}

  @keyframes rsPing{0%{stroke-width:2; opacity:.9;} 65%{stroke-width:14; opacity:0;} 100%{stroke-width:14; opacity:0;}}
