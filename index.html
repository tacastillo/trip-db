/* Track geometry runs to the real termini now (OpenStreetMap via Overpass, ODbL),
   and every path says how each of its two ends came about: "terminus" is where
   the line actually stops, "junction" is where a branch or loop path meets
   another path of the same line, and "clip" is the 40km cut-off around the city.
   Only a "clip" end is a lie about the network, so only that one gets faded out
   over its last few km. Everything else draws solid, right to the end. */
const TAPER_STEPS = 8;             // a long dissolve, not a few visible steps
function railSegments(path){
  const pa = path.pts, ends = path.ends || [];
  const solid = [{ pts: pa, fade: 1 }];
  if (pa.length < 12) return solid;
  const cutA = ends[0] === "clip", cutB = ends[1] === "clip";
  const cuts = (cutA ? 1 : 0) + (cutB ? 1 : 0);
  if (!cuts) return solid;
  // ~3km of fade where there is room, but never more than 40% of a short stub
  const chunk = Math.max(1, Math.min(6, Math.floor(pa.length * 0.4 / (cuts * TAPER_STEPS))));
  const fade = j => (j + 1) / (TAPER_STEPS + 1);   // j = 0 at the tip
  const segs = [];
  let lo = 0, hi = pa.length - 1;
  if (cutA) {
    // chunks overlap by a point so the ramp has no seams
    for (let j = 0; j < TAPER_STEPS; j++) segs.push({ pts: pa.slice(j * chunk, (j + 1) * chunk + 1), fade: fade(j) });
    lo = TAPER_STEPS * chunk;
  }
  if (cutB) {
    for (let j = 0; j < TAPER_STEPS; j++) {
      const b = pa.length - 1 - j * chunk;
      segs.push({ pts: pa.slice(b - chunk, b + 1), fade: fade(j) });
    }
    hi = pa.length - 1 - TAPER_STEPS * chunk;
  }
  if (hi > lo) segs.push({ pts: pa.slice(lo, hi + 1), fade: 1 });
  return segs;
}

/* the day has to read against thirteen coloured lines, so they step back for it */
function railFade(){ return document.body.classList.contains("planning") ? 0.3 : 1; }
function drawRail(){
  if (!railLayer || !window.L) return;
  railLayer.clearLayers();
  const casing = night ? "#15120D" : "#ffffff";
  (RAIL[currentTab]||[]).forEach(function(ln){ ln.paths.forEach(function(pa){
    railSegments(pa).forEach(function(sg){
      L.polyline(sg.pts, { renderer: railRenderer, color: casing, weight: 6, opacity: 0.5 * sg.fade * railFade(), lineCap: "round", lineJoin: "round", interactive: false }).addTo(railLayer);
    });
  }); });
  (RAIL[currentTab]||[]).forEach(function(ln){ ln.paths.forEach(function(pa){
    railSegments(pa).forEach(function(sg){
      L.polyline(sg.pts, { renderer: railRenderer, color: ln.color, weight: 3, opacity: 0.92 * sg.fade * railFade(), lineCap: "round", lineJoin: "round", interactive: false }).addTo(railLayer);
    });
  }); });
}

function setBaseLayer(){
  if (!map) return;
  if (baseLayer) map.removeLayer(baseLayer);
  const style = night ? "dark_all" : "light_all";
  baseLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
    attribution: "© OpenStreetMap © CARTO", subdomains: "abcd", maxZoom: 20,
  });
  baseLayer.on("load", () => { tilesOk = true; document.getElementById("tilebanner").style.display = "none"; });
  baseLayer.addTo(map);
}

/* ===========================================================
   THE RIDE  —  drawing a route over the real track geometry
   The rail blobs above are bare polylines with no station index,
   so a ride is traced by snapping both ends onto the track and
   walking the line's own geometry between them: every line becomes
   a small graph (its paths, stitched where branches meet and where
   the Line 2 ring closes) and the ride is the shortest walk through
   it — which is what picks the sane way round the loop.
   =========================================================== */
/* ==== geo-core:start ==== */
const EARTH_R = 6371000, DEG = Math.PI / 180;
function metres(a, b){
  const dy = (b[0] - a[0]) * DEG * EARTH_R;
  const dx = (b[1] - a[1]) * DEG * EARTH_R * Math.cos((a[0] + b[0]) / 2 * DEG);
  return Math.hypot(dx, dy);
}
function lerpPt(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
/* closest point on segment a–b to c — stations sit between vertices far more
   often than on one, so projecting is what keeps the ride ending at the label */
function projectOnSeg(c, a, b){
  const k = Math.cos(a[0] * DEG);
  const ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0], cx = c[1] * k, cy = c[0];
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
  let t = l2 ? ((cx - ax) * vx + (cy - ay) * vy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const pt = lerpPt(a, b, t);
  return { pt, d: metres(c, pt) };
}
/* ==== geo-core:end ==== */
const railGraphs = {};
function railGraph(city, ref){
  const key = city + "/" + ref;
  if (key in railGraphs) return railGraphs[key];
  const ln = (RAIL[city] || []).find(l => l.ref === ref);
  if (!ln) return (railGraphs[key] = null);
  const nodes = [], adj = [], segs = [], owner = [];
  ln.paths.forEach((p, pi) => {
    let prev = -1;
    p.pts.forEach(pt => {
      const i = nodes.length; nodes.push(pt); adj.push([]); owner.push(pi);
      if (prev >= 0){
        const d = metres(nodes[prev], pt);
        adj[prev].push([i, d]); adj[i].push([prev, d]); segs.push([prev, i]);
      }
      prev = i;
    });
  });
  const ends = []; let base = 0;
  ln.paths.forEach(p => {
    const a = base, b = base + p.pts.length - 1;
    // Line 2 is a ring: same place at both ends of the path, but two nodes
    if (metres(nodes[a], nodes[b]) < 50){ adj[a].push([b, 0]); adj[b].push([a, 0]); }
    ends.push(a, b); base += p.pts.length;
  });
  // branches meet the trunk at a station the two polylines don't share a vertex with
  ends.forEach(e => {
    let best = -1, bd = 700;
    for (let i = 0; i < nodes.length; i++){
      if (owner[i] === owner[e]) continue;
      const d = metres(nodes[i], nodes[e]);
      if (d < bd){ bd = d; best = i; }
    }
    if (best >= 0){ adj[e].push([best, bd]); adj[best].push([e, bd]); }
  });
  return (railGraphs[key] = { nodes, adj, segs });
}
function snapToLine(g, c){
  let best = null;
  for (const [i, j] of g.segs){
    const r = projectOnSeg(c, g.nodes[i], g.nodes[j]);
    if (!best || r.d < best.d) best = { d: r.d, i, j, pt: r.pt };
  }
  return best;
}
function ride(g, from, to){
  const A = snapToLine(g, from), B = snapToLine(g, to);
  if (!A || !B) return null;
  if (A.i === B.i && A.j === B.j) return [A.pt, B.pt];
  const n = g.nodes.length;
  const D = new Array(n).fill(Infinity), P = new Array(n).fill(-1), seen = new Array(n).fill(false);
  D[A.i] = metres(A.pt, g.nodes[A.i]); D[A.j] = metres(A.pt, g.nodes[A.j]);
  for (;;){
    let u = -1, bd = Infinity;
    for (let i = 0; i < n; i++) if (!seen[i] && D[i] < bd){ bd = D[i]; u = i; }
    if (u < 0) break;
    seen[u] = true;
    for (const [v, w] of g.adj[u]) if (D[u] + w < D[v]){ D[v] = D[u] + w; P[v] = u; }
  }
  let end = -1, bd = Infinity;
  for (const i of [B.i, B.j]){
    const t = D[i] + metres(B.pt, g.nodes[i]);
    if (t < bd){ bd = t; end = i; }
  }
  if (end < 0 || !isFinite(bd)) return null;
  const mid = [];
  for (let cur = end; cur >= 0; cur = P[cur]) mid.push(g.nodes[cur]);
  mid.reverse();
  return [A.pt, ...mid, B.pt];
}
function measure(pts){
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + metres(pts[i - 1], pts[i]));
  return cum;
}
function tidy(pts){
  const out = [];
  for (const p of pts) if (!out.length || metres(out[out.length - 1], p) > 2) out.push(p);
  return out;
}

function lineMeta(ref, city){
  const ln = (RAIL[city || currentTab] || []).find(l => l.ref === ref)
    || (typeof SUBWAY !== "undefined" && SUBWAY.find(l => l.ref === ref));
  return ln || { label: "Line " + ref, color: "#888" };
}

/* Rough door-to-door numbers, and honestly rough: Seoul metro averages about
   33 km/h once dwell time is in, a transfer costs a few minutes of stairs and
   platform, and street walking is never the straight line the map draws. */
/* One per statement, not one comma-separated line: tools/lib.mjs finds a constant
   by searching for the literal text `const NAME = `, so a name that only ever
   appears after a comma is invisible to the checkers. */
const RIDE_KMH = 33;
const WALK_KMH = 4.6;
const XFER_MIN = 4;
const WALK_BEND = 1.3;

/* hotel → …transfers… → the station you get off at → the door */
const journeys = {};
function journeyFor(p){
  if (!(p.id in journeys)) journeys[p.id] = buildJourney(p);
  return journeys[p.id];
}
/* The walk the nearest-station guess is allowed to hand you, in metres. Sized to
   the longest walk in PLACE_OFF, so a guess is never worse than a hand-set one —
   past that the nearest station isn't really the station for that spot. It also
   keeps cities with no station table of their own from matching anything. */
const AUTO_WALK_MAX = 1100;
function offStationFor(p){
  if (PLACE_OFF[p.id]) return PLACE_OFF[p.id];
  if (p.cat === "hotel") return null;             // the ride starts here
  let best = null;
  for (const s in STATION_COORDS){
    if (!ROUTES[s]) continue;
    const d = metres([p.lat, p.lng], STATION_COORDS[s]);
    if (!best || d < best.d) best = { s, d };
  }
  return best && best.d <= AUTO_WALK_MAX ? best.s : null;
}
function buildJourney(p){
  const off = offStationFor(p);
  if (!off || !ROUTES[off] || !STATION_COORDS[off] || !STATION_COORDS[HOTEL_STATION]) return null;
  const legs = [];
  let from = HOTEL_STATION;
  for (const leg of ROUTES[off]){
    const g = railGraph(p.city, leg.line), a = STATION_COORDS[from], b = STATION_COORDS[leg.to];
    if (!g || !a || !b) return null;
    const traced = ride(g, a, b);
    if (!traced) return null;
    const m = lineMeta(leg.line, p.city);
    // both ends run to the station dots, so the drawn ride starts and stops where the labels do
    legs.push({ kind: "rail", line: leg.line, label: m.label, color: m.color,
                from, to: leg.to, pts: tidy([a, ...traced, b]) });
    from = leg.to;
  }
  legs.push({ kind: "walk", from: off, to: p.name, pts: [STATION_COORDS[off], [p.lat, p.lng]] });
  legs.forEach(l => { l.cum = measure(l.pts); l.len = l.cum[l.cum.length - 1]; });
  const rail = legs.filter(l => l.kind === "rail");
  const walk = legs[legs.length - 1].len * WALK_BEND;
  const ridden = rail.reduce((s, l) => s + l.len, 0);
  const box = [[90, 180], [-90, -180]];
  legs.forEach(l => l.pts.forEach(pt => {
    box[0][0] = Math.min(box[0][0], pt[0]); box[0][1] = Math.min(box[0][1], pt[1]);
    box[1][0] = Math.max(box[1][0], pt[0]); box[1][1] = Math.max(box[1][1], pt[1]);
  }));
  return {
    off, legs, rail, box, ridden, walk,
    minutes: Math.max(1, Math.round(ridden / 1000 / RIDE_KMH * 60
      + (rail.length - 1) * XFER_MIN + walk / 1000 / WALK_KMH * 60)),
  };
}

function routeStripHtml(p){
  const j = journeyFor(p);
  if (!j) return "";
  const rows = j.rail.map((leg, i) => {
    const last = i === j.rail.length - 1;
    return `<div class="pr-step"><span class="pr-line" style="background:${leg.color}">${leg.label}</span>
      <span class="pr-txt"><span class="pr-arr">→</span>
      <span class="${last ? "pr-off" : "pr-to"}">${leg.to}</span>
      <span class="pr-tag${last ? " hop" : ""}">${last ? "get off" : "transfer"}</span></span></div>`;
  });
  const walk = j.walk < 950 ? `${Math.round(j.walk / 10) * 10} m walk` : `${(j.walk / 1000).toFixed(1)} km walk`;
  return `<div class="pop-route"><span class="pr-k">From the hotel</span>${rows.join("")}
    <div class="pr-walk">🚶 ${walk} to the door · ≈ ${j.minutes} min door to door</div></div>`;
}

function cssVar(v){ return getComputedStyle(document.body).getPropertyValue(v).trim() || "#C8432A"; }

/* ---------------- drawing and animating the ride ---------------- */
let routeAnim = null, routeDraw = null;
const lessMotion = window.matchMedia("(prefers-reduced-motion:reduce)");

function stationDots(j){
  const stops = [{ name: HOTEL_STATION, kind: "board", kicker: "Board", tint: CATS.hotel.color }];
  j.rail.forEach((leg, i) => {
    const last = i === j.rail.length - 1;
    const next = last ? null : j.rail[i + 1];
    stops.push({
      name: leg.to,
      kind: last ? "off" : "transfer",
      kicker: last ? "Get off here" : "Transfer → " + next.label,
      tint: leg.color, then: next ? next.color : null,
    });
  });
  stops.forEach(s => {
    const c = STATION_COORDS[s.name]; if (!c) return;
    if (s.kind === "off"){
      L.circleMarker(c, { radius: 7, color: cssVar("--accent"), weight: 2, opacity: .9,
        fill: false, interactive: false, className: "rs-ping" }).addTo(routeLayer);
    }
    const fill = s.kind === "off" ? cssVar("--accent") : s.tint;
    const dot = L.circleMarker(c, { radius: s.kind === "board" ? 5.5 : s.kind === "off" ? 7 : 8,
      color: "#fff", weight: 2.5, fillColor: fill, fillOpacity: 1, interactive: false }).addTo(routeLayer);
    // a transfer wears both lines: the one arriving outside, the one leaving in the middle
    if (s.kind === "transfer" && s.then){
      L.circleMarker(c, { radius: 3.6, stroke: false, fillColor: s.then, fillOpacity: 1,
        interactive: false }).addTo(routeLayer);
    }
    dot.bindTooltip(`<span class="rs-k">${s.kicker}</span>${s.name}`,
      { permanent: true, direction: "auto", className: "rs-tip " + s.kind, offset: [9, 0] });
  });
}

/* Permanent labels don't know about each other, and two stations a few hundred
   metres apart put theirs in the same place. Push the later ones clear. */
function spaceLabels(){
  if (!routeDraw || !routeLayer) return;
  const els = [];
  routeLayer.eachLayer(l => {
    const t = l.getTooltip && l.getTooltip(), el = t && t.getElement();
    if (el){ el.style.marginTop = ""; els.push(el); }
  });
  if (els.length < 2) return;
  els.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
  for (let i = 1; i < els.length; i++){
    let shift = 0;
    for (let k = 0; k < i; k++){
      const prev = els[k].getBoundingClientRect(), cur = els[i].getBoundingClientRect();
      const down = Math.min(prev.bottom, cur.bottom) - Math.max(prev.top, cur.top);
      const across = Math.min(prev.right, cur.right) - Math.max(prev.left, cur.left);
      if (down > -3 && across > -3){
        shift += prev.bottom + 5 - cur.top;
        els[i].style.marginTop = shift + "px";
      }
    }
  }
}

function showRoute(p){
  clearRoute();
  if (!routeLayer || !map || !window.L) return;
  const j = journeyFor(p);
  if (!j) return;
  document.body.classList.add("routing");
  const casing = night ? "#15120D" : "#ffffff";
  const accent = cssVar("--accent");
  const shapes = j.legs.map(leg => {
    const walking = leg.kind === "walk";
    const color = walking ? accent : leg.color;
    // glow first so it sits under the casing; its opacity is the pulse, in CSS
    const glow = L.polyline([], { color, weight: walking ? 10 : 16, opacity: 1,
      lineCap: "round", lineJoin: "round", interactive: false, className: "rs-glow" }).addTo(routeLayer);
    const under = L.polyline([], { color: casing, weight: walking ? 6 : 9, opacity: .55,
      lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeLayer);
    const over = L.polyline([], { color, weight: walking ? 3 : 5, opacity: .96,
      lineCap: "round", lineJoin: "round", dashArray: walking ? "1 8" : null,
      interactive: false }).addTo(routeLayer);
    return { leg, glow, under, over, color, start: 0 };
  });
  let run = 0;
  shapes.forEach(s => { s.start = run; run += s.leg.len; });
  const total = run;
  // the moving head rides on top of everything the legs drew
  const comet = L.polyline([], { color: "#fff", weight: 3, opacity: .95,
    lineCap: "round", lineJoin: "round", interactive: false }).addTo(routeLayer);
  const head = L.circleMarker(j.legs[0].pts[0], { radius: 4.5, color: "#fff", weight: 2,
    fillColor: accent, fillOpacity: 1, interactive: false }).addTo(routeLayer);
  stationDots(j);
  routeDraw = { shapes, comet, head, total, j };
  requestAnimationFrame(spaceLabels);
  hideComet();
  if (lessMotion.matches || total <= 0){ revealTo(total); return; }
  animateRoute();
}

function revealTo(dist){
  if (!routeDraw) return;
  routeDraw.shapes.forEach(s => {
    const local = dist - s.start;
    if (local <= 0){ s.glow.setLatLngs([]); s.under.setLatLngs([]); s.over.setLatLngs([]); return; }
    const pts = s.leg.pts, cum = s.leg.cum, out = [pts[0]];
    for (let i = 1; i < pts.length; i++){
      if (cum[i] <= local){ out.push(pts[i]); continue; }
      const span = cum[i] - cum[i - 1];
      out.push(lerpPt(pts[i - 1], pts[i], span > 0 ? (local - cum[i - 1]) / span : 1));
      break;
    }
    s.glow.setLatLngs(out); s.under.setLatLngs(out); s.over.setLatLngs(out);
  });
}

function pointAt(dist){
  const shapes = routeDraw.shapes;
  let s = shapes[0];
  for (const sh of shapes) if (dist >= sh.start) s = sh;
  const local = Math.max(0, Math.min(s.leg.len, dist - s.start));
  const pts = s.leg.pts, cum = s.leg.cum;
  let i = 1;
  while (i < pts.length - 1 && cum[i] < local) i++;
  const span = cum[i] - cum[i - 1];
  return { pt: lerpPt(pts[i - 1], pts[i], span > 0 ? (local - cum[i - 1]) / span : 1), shape: s };
}

function drawComet(from, to){
  const { comet, head, total } = routeDraw;
  const a = Math.max(0, from), b = Math.min(total, to);
  if (b <= a){ hideComet(); return; }
  const tail = pointAt(a), tip = pointAt(b);
  const out = [tail.pt];
  routeDraw.shapes.forEach(s => s.leg.pts.forEach((pt, i) => {
    const d = s.start + s.leg.cum[i];
    if (d > a && d < b) out.push(pt);
  }));
  out.push(tip.pt);
  comet.setLatLngs(out);
  head.setLatLng(tip.pt);
  if (routeDraw.tint !== tip.shape.color){
    routeDraw.tint = tip.shape.color;
    head.setStyle({ opacity: 1, fillOpacity: 1, fillColor: tip.shape.color });
  }
}
function hideComet(){
  if (!routeDraw) return;
  routeDraw.comet.setLatLngs([]);
  routeDraw.tint = null;
  routeDraw.head.setStyle({ opacity: 0, fillOpacity: 0 });
}

function animateRoute(){
  const total = routeDraw.total;
  const revealMs = Math.max(900, Math.min(2400, total * .26));
  const runMs = Math.max(1500, Math.min(3400, total * .34));
  const restMs = 600;
  const tail = Math.max(350, total * .13);
  let t0 = null, whole = false;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = ts => {
    if (!routeDraw) return;
    if (t0 === null) t0 = ts;
    const el = ts - t0;
    if (el < revealMs){
      revealTo(ease(el / revealMs) * total);
    } else {
      if (!whole){ revealTo(total); whole = true; }
      const c = (el - revealMs) % (runMs + restMs);
      if (c < runMs){
        const tip = (c / runMs) * (total + tail);
        drawComet(tip - tail, tip);
      } else hideComet();
    }
    routeAnim = requestAnimationFrame(step);
  };
  routeAnim = requestAnimationFrame(step);
}

function clearRoute(){
  if (routeAnim){ cancelAnimationFrame(routeAnim); routeAnim = null; }
  routeDraw = null;
  if (routeLayer) routeLayer.clearLayers();
  document.body.classList.remove("routing");
}

function fitCity(){
  const pts = PLACES.filter(p => p.city === currentTab).map(p => [p.lat, p.lng]);
  if (!pts.length || !map) return;
  // Tighter padding than a plain fitBounds — the rail now runs off every edge
  // by itself, so this is purely about not stranding the pins in dead space.
  const pad = isMobile() ? 16 : 40;
  map.fitBounds(L.latLngBounds(pts), { padding: [pad, pad], animate: false });
}
function initMap(){
  map = L.map("map", { scrollWheelZoom: true, zoomSnap: 0.25 }).setView([37.5535, 126.9905], 12);

  setBaseLayer();

  // the fade multiplies the polyline count, so draw the rail on canvas to keep panning cheap.
  // Its own pane below the overlay lets a picked route drop the whole network back a step.
  map.createPane("railPane").style.zIndex = 380;
  railRenderer = L.canvas({ padding: 0.4, pane: "railPane" });
  railLayer = L.layerGroup();
  if (railOn) railLayer.addTo(map);
  drawRail();
  routeLayer = L.layerGroup().addTo(map);
  map.on("click", () => { if (selectedId) deselect(); });
  // station labels pick their side from the map centre, which panning moves out from under them
  map.on("moveend", () => {
    if (!routeDraw) return;
    routeLayer.eachLayer(l => { const t = l.getTooltip && l.getTooltip(); if (t) t.update(); });
    spaceLabels();
  });

  PLACES.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p, null) });
    m.on("click", () => select(p.id));
    markers[p.id] = m;
    if (p.city === currentTab) m.addTo(map);
    if (selectedId === p.id) markPin(p.id, true);
  });

  // a day restored from the link has to reach the pins before they are first drawn
  syncMarkers();
  if (document.body.classList.contains("planning")) drawRail();
  // opening a plan link and landing on the whole city hides the very thing the link
  // was for, so a day in the URL frames itself instead
  if (planStops().some(s => s.place)) fitPlan(); else fitCity();

  // Tiles are the one thing still fetched live. Everything else ships with the page,
  // so losing them degrades to pins-on-a-blank-canvas rather than a broken map.
  setTimeout(() => { if (!tilesOk) showTileBanner(); }, 3500);
  window.addEventListener("offline", showTileBanner);
  window.addEventListener("online", () => {
    document.getElementById("tilebanner").style.display = "none";
    if (baseLayer) baseLayer.redraw();
  });
}

function showTileBanner(){
  const b = document.getElementById("tilebanner");
  b.textContent = navigator.onLine
    ? "Street tiles aren’t loading — the pins, subway lines, notes and list all still work."
    : "Offline, so no street tiles — the pins, subway lines, notes and list all still work.";
  b.style.display = "block";
}

/* The pin a planned stop gets: the same shape and category colour, carrying its place
   in the day instead of its emoji. One marker per stop, not a pin plus a chip beside it. */
function pinIcon(p, n){
  const c = CATS[p.cat] || {};
  return L.divIcon({
    className: "",
    html: `<div class="pin${n ? " plan" : ""}" style="--pin:${c.color}">
             <div class="pin-b"><span${n ? ' class="pin-n"' : ""}>${n || c.emoji}</span></div></div>`,
    iconSize: [30, 30], iconAnchor: [15, 30],
  });
}

function syncMarkers(){
  if (!map) return;
  const order = {};
  planStops().forEach((s, i) => { if (s.place) order[s.id] = i + 1; });
  document.body.classList.toggle("planning",
    currentTab === plan.city && Object.keys(order).length > 0);
  PLACES.forEach(p => {
    const m = markers[p.id]; if (!m) return;
    const n = order[p.id] || null;
    // setIcon rebuilds the element, so only touch it when the number actually changed
    if (m._planN !== n){
      m._planN = n;
      m.setIcon(pinIcon(p, n));
      if (selectedId === p.id) markPin(p.id, true);
    }
    const el = m.getElement();
    if (el) el.classList.toggle("mk-plan", !!n);
    // a planned stop stays on the map whatever the chips say — otherwise its number
    // in the plan points at a pin that isn't there
    if (p.city === currentTab && (active[p.cat] || planHas(p.id))) { if (!map.hasLayer(m)) m.addTo(map); }
    else { if (map.hasLayer(m)) map.removeLayer(m); }
  });
  // filtering the selected pin away shouldn't leave its card and ride stranded
  const sel = selectedId && PLACES.find(x => x.id === selectedId);
  if (sel && !(sel.city === currentTab && (active[sel.cat] || planHas(sel.id)))) deselect();
}

function markPin(id, on){
  const m = markers[id], el = m && m.getElement();
  if (el) el.classList.toggle("mk-sel", on);
}
function select(id){
  const p = PLACES.find(x => x.id === id); if (!p) return;
  if (selectedId && selectedId !== id) markPin(selectedId, false);
  selectedId = id;
  highlightList();
  showCard(p);
  if (!map || !markers[id]) return;
  markPin(id, true);
  // the map stays put: a ride that draws while the view is still moving is
  // two animations fighting, and the opening view already frames the city
  showRoute(p);
}
function deselect(){
  if (selectedId) markPin(selectedId, false);
  selectedId = null;
  hideCard();
  clearRoute();
  highlightList();
}
function focus(id){
  if (!PLACES.some(x => x.id === id)) return;
  if (isMobile() && view !== "map") {
    // swap to the map first, let it re-measure, then move — a hidden map flies to the wrong spot
    setView("map");
    setTimeout(() => { map && map.invalidateSize(); select(id); }, 90);
  } else select(id);
}


/* ---------------- day plan: the pure core ---------------- */
/* ==== plan-core:start ==== */
/* Everything between these sentinels is pure. It reads the data tables and its own
   arguments and nothing else — no document, no map, no history, no mutable page
   state. tools/test-plan.mjs slices this block straight out of the file and runs it
   in Node, which keeps working only for as long as that stays true. */

/* A plan lives in the query string and nowhere else. Twelve stops keeps the link
   pasteable and keeps the 2-opt pass below trivially cheap. */
const PLAN_MAX_STOPS = 12;
const PLAN_TITLE_MAX = 60;
const PLAN_PARAMS = { city:"city", stops:"stops", day:"day", title:"title" };

/* Suggestions. The radius is deliberately tighter than AUTO_WALK_MAX: that one asks
   "could you walk this from a station", this one asks "is this near enough that you'd
   tack it on", which is a shorter walk. */
const NEAR_RADIUS_M = 900;
const NEAR_MAX = 6;
const NEAR_CLUSTER_BONUS = 0.35, NEAR_NEW_CLUSTER_PENALTY = 0.15;
const NEAR_VARIETY_BONUS = 0.12, NEAR_NEW_PLACE_BONUS = 0.05;

/* Two guards on the backtracking warning, for the reason check-data.mjs pairs its
   dogleg ratio with an absolute: the fraction alone cries wolf on a tight plan, the
   absolute alone stays quiet on a sprawling one. */
const SWAP_GAIN_M = 250, SWAP_GAIN_FRAC = 0.08;
const REORDER_MAX_PASSES = 8;

/* Past this, "walk it" stops being advice. */
const HOP_WALKABLE_M = 1200;

const DOW = ["mon","tue","wed","thu","fri","sat","sun"];
const DOW_LABEL = { mon:"Monday", tue:"Tuesday", wed:"Wednesday", thu:"Thursday",
                    fri:"Friday", sat:"Saturday", sun:"Sunday" };

/* A station should sit on the line that serves it; check-data.mjs holds the tables to
   the same 400m. */
const STATION_ON_LINE_M = 400;

const stationLineMemo = {};
/** Which lines run through a station, worked out from the geometry rather than stored. */
function stationLines(st, city, rail, coords){
  const key = city + "/" + st;
  if (stationLineMemo[key]) return stationLineMemo[key];
  const c = (coords || STATION_COORDS)[st];
  const out = [];
  if (c) (rail || RAIL)[city].forEach(l => {
    const near = l.paths.some(path => {
      for (let i = 1; i < path.pts.length; i++)
        if (projectOnSeg(c, path.pts[i - 1], path.pts[i]).d <= STATION_ON_LINE_M) return true;
      return false;
    });
    if (near) out.push(l.ref);
  });
  return (stationLineMemo[key] = out);
}

/** The one line that carries you between two stations without changing, or null.
    Only the no-transfer case is ever answered. A transfer would mean picking an
    interchange out of STATION_COORDS, which holds the thirty-odd stops the routes
    happen to use rather than the network — routing through it sends you Hongik Univ
    to Mangwon the long way round, 17km for a walk of one. Naver can answer the rest;
    this only says what the geometry already proves. */
function hopLine(stA, stB, city, rail, coords){
  if (!stA || !stB || stA === stB) return null;
  const R = (rail || RAIL)[city] || [];
  const bs = stationLines(stB, city, rail, coords);
  const ref = stationLines(stA, city, rail, coords).find(r => bs.indexOf(r) >= 0);
  if (!ref) return null;
  const l = R.find(x => x.ref === ref);
  return l ? { ref, label: l.label, color: l.color, from: stA, to: stB } : null;
}

/** Metres as the rest of the page words them. */
function fmtM(m){
  return m < 950 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
}

/** "2026-09-01" -> "tue". Empty for anything that isn't a real calendar date. */
function planDow(day){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day || "");
  if (!m) return "";
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  // Date.UTC rolls 2026-13-45 over into next year rather than refusing it
  if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return "";
  return DOW[(d.getUTCDay() + 6) % 7];
}

/* The only shapes that actually occur in meta: "Closed Mon", "Closed Mon-Tue",
   "Closed Sun/Mon", "Closed Tue · Catchtable". A dash is a range, a slash or comma is
   a list. Anything else is left alone and shown verbatim — this reads the handful of
   forms the trip notes use, it is not a hours parser, and it must never become one. */
const CLOSED_RE = /^closed\s+((?:mon|tue|wed|thu|fri|sat|sun)(?:\s*[–—\-\/,&]\s*(?:mon|tue|wed|thu|fri|sat|sun))*)/i;
function closedDays(meta){
  const m = CLOSED_RE.exec(String(meta || "").trim());
  if (!m) return [];
  const names = m[1].toLowerCase().match(/mon|tue|wed|thu|fri|sat|sun/g) || [];
  const range = /[–—\-]/.test(m[1]) && names.length === 2;
  if (!range) return names;
  const a = DOW.indexOf(names[0]), b = DOW.indexOf(names[1]);
  if (a < 0 || b < 0) return names;
  const out = [];
  for (let i = a; ; i = (i + 1) % 7){ out.push(DOW[i]); if (i === b || out.length > 7) break; }
  return out;
}

/** location.search -> a plan. Never reads location itself, so it can be tested. */
function decodePlanQuery(search, legs, max){
  const q = new URLSearchParams(String(search || "").replace(/^\?/, ""));
  const cap = max || PLAN_MAX_STOPS;
  const legIds = (legs || LEGS).map(l => l.id);
  const asked = q.get(PLAN_PARAMS.city);
  const city = legIds.indexOf(asked) >= 0 ? asked : legIds[0];
  const ids = [];
  String(q.get(PLAN_PARAMS.stops) || "").split(",").forEach(s => {
    const id = s.trim();
    // a repeated id would give one place two numbers on the map and two rows to drag
    if (id && ids.indexOf(id) < 0) ids.push(id);
  });
  const day = /^\d{4}-\d{2}-\d{2}$/.test(q.get(PLAN_PARAMS.day) || "") ? q.get(PLAN_PARAMS.day) : "";
  const title = String(q.get(PLAN_PARAMS.title) || "").slice(0, PLAN_TITLE_MAX);
  const mine = Object.keys(PLAN_PARAMS).map(k => PLAN_PARAMS[k]);
  const extra = [];
  q.forEach((v, k) => { if (mine.indexOf(k) < 0) extra.push([k, v]); });
  return { city, ids: ids.slice(0, cap), day, title, over: Math.max(0, ids.length - cap), extra };
}

/** The inverse. Anything someone else hung on the URL rides along untouched. */
function encodePlanQuery(plan){
  const q = new URLSearchParams();
  (plan.extra || []).forEach(kv => q.append(kv[0], kv[1]));
  if (plan.city) q.set(PLAN_PARAMS.city, plan.city);
  if (plan.ids && plan.ids.length) q.set(PLAN_PARAMS.stops, plan.ids.join(","));
  if (plan.day) q.set(PLAN_PARAMS.day, plan.day);
  if (plan.title) q.set(PLAN_PARAMS.title, plan.title);
  // URLSearchParams escapes the separator; the whole point of this grammar is that a
  // person or an agent can read the ids straight off the link, so put it back.
  const s = q.toString().replace(/%2C/g, ",");
  return s ? "?" + s : "";
}

/** Ids to rows. An id we no longer know stays in the list as a row with no place —
    dropping it would quietly amputate a stop from someone else's shared link. */
function resolvePlan(ids, places){
  const by = {};
  (places || PLACES).forEach(p => { by[p.id] = p; });
  return (ids || []).map(id => ({ id, place: by[id] || null }));
}

/** Free-text search over everything a row actually shows. */
function matchesQuery(p, q, cats){
  const s = String(q || "").trim().toLowerCase();
  if (!s) return true;
  const cat = (cats || CATS)[p.cat];
  const hay = [p.name, p.note, p.meta, p.cluster, cat && cat.label].join(" ").toLowerCase();
  return s.split(/\s+/).every(t => hay.indexOf(t) >= 0);
}

function hopMetres(a, b){ return metres([a.lat, a.lng], [b.lat, b.lng]); }

/** The same arithmetic buildJourney already uses for its walk to the door. */
function hopWalk(a, b){
  const m = hopMetres(a, b) * WALK_BEND;
  return { m, minutes: Math.max(1, Math.round(m / 1000 / WALK_KMH * 60)) };
}

function naverMode(a, b){
  if (hopMetres(a, b) <= HOP_WALKABLE_M) return "walk";
  return a.city === "jeju" ? "car" : "transit";     // Jeju has no metro to ride
}

/* Naver's web directions URL is positional, not named: two place blocks separated by
   "/", then "/-/" (the waypoint slot, empty), then the mode. A block is

       lng,lat,name,,

   and the two trailing empty fields are Naver's own place-id and place-type slots,
   which we do not have. Note the coordinates are LONGITUDE FIRST — the opposite of
   every other coordinate pair in this file — so that swap happens here and nowhere
   else. encodeURIComponent on the name is load-bearing: it turns a comma inside a
   name into %2C, which the field separator no longer matches.

   This is the one function to change if a link ever stops resolving. Nothing in the
   environment this was written in could reach Naver to check it. Naver's documented
   app scheme, for reference, is
       nmap://route/public|car|walk|bicycle?slat=&slng=&sname=&dlat=&dlng=&dname=&appname= */
function naverDirUrl(a, b, mode){
  const block = p => `${p.lng},${p.lat},${encodeURIComponent(p.name)},,`;
  return `https://map.naver.com/p/directions/${block(a)}/${block(b)}/-/${mode || naverMode(a, b)}`;
}
function naverAppUrl(a, b, mode){
  const m = mode || naverMode(a, b);
  const q = new URLSearchParams({
    slat:a.lat, slng:a.lng, sname:a.name,
    dlat:b.lat, dlng:b.lng, dname:b.name, appname:"trip-db",
  });
  return `nmap://route/${m === "transit" ? "public" : m}?${q}`;
}

/** One entry per gap between consecutive stops; null where an end is unresolved.
    offFor maps a place to the station you get off at — passed in rather than reached
    for, so this stays runnable outside the page. */
function planLegs(stops, offFor){
  const legs = [];
  for (let i = 0; i < stops.length - 1; i++){
    const a = stops[i].place, b = stops[i + 1].place;
    if (!a || !b){ legs.push(null); continue; }
    const mode = naverMode(a, b), w = hopWalk(a, b);
    const line = (mode !== "walk" && offFor) ? hopLine(offFor(a), offFor(b), a.city) : null;
    legs.push({ i, a, b, metres: hopMetres(a, b), mode, walkable: mode === "walk",
                walkM: w.m, walkMin: w.minutes, line,
                naver: naverDirUrl(a, b, mode), naverApp: naverAppUrl(a, b, mode) });
  }
  return legs;
}

/** Raw metres end to end. No WALK_BEND: every caller compares two of these, and a
    constant factor cancels out of a comparison. */
function pathLen(stops){
  let t = 0;
  for (let i = 0; i < stops.length - 1; i++){
    const a = stops[i].place, b = stops[i + 1].place;
    if (a && b) t += hopMetres(a, b);
  }
  return t;
}

function planStats(stops, offFor){
  const legs = planLegs(stops, offFor);
  let total = 0, walkM = 0, walkMin = 0, rides = 0;
  legs.forEach(l => {
    if (!l) return;
    total += l.metres;
    if (l.walkable){ walkM += l.walkM; walkMin += l.walkMin; } else rides++;
  });
  return { legs, total, walkM, walkMin, rides, resolved: stops.filter(s => s.place).length };
}

/** Adjacent pairs that would be shorter the other way round. */
function backtracks(stops){
  const base = pathLen(stops), out = [];
  for (let i = 0; i < stops.length - 1; i++){
    const swapped = stops.slice();
    swapped[i] = stops[i + 1]; swapped[i + 1] = stops[i];
    const gain = base - pathLen(swapped);
    if (gain > SWAP_GAIN_M && gain > base * SWAP_GAIN_FRAC) out.push({ i, gain });
  }
  return out;
}

/** Nearest-neighbour from wherever you said you start, then 2-opt. Only ever a
    suggestion: it returns the identity order unless it genuinely beats what you have,
    so offering it twice in a row cannot make the plan wander. */
function reorderByProximity(stops){
  const idx = stops.map((_, i) => i);
  const before = pathLen(stops);
  const flat = { order: idx, before_m: before, after_m: before, gain_m: 0 };
  if (stops.length < 3 || !stops.every(s => s.place)) return flat;
  const len = o => {
    let t = 0;
    for (let i = 0; i < o.length - 1; i++) t += hopMetres(stops[o[i]].place, stops[o[i + 1]].place);
    return t;
  };
  const order = [0], left = idx.slice(1);
  while (left.length){
    const last = stops[order[order.length - 1]].place;
    let best = 0, bd = Infinity;
    left.forEach((j, k) => {
      const d = hopMetres(last, stops[j].place);
      if (d < bd - 1e-9){ bd = d; best = k; }        // ties keep the earlier stop
    });
    order.push(left.splice(best, 1)[0]);
  }
  for (let pass = 0; pass < REORDER_MAX_PASSES; pass++){
    let improved = false;
    for (let i = 1; i < order.length - 1 && !improved; i++){
      for (let j = i + 1; j < order.length && !improved; j++){
        const cand = order.slice(0, i).concat(order.slice(i, j + 1).reverse(), order.slice(j + 1));
        // first improving move, not the best one: same input must give the same output
        if (len(cand) < len(order) - 1e-9){ order.length = 0; order.push.apply(order, cand); improved = true; }
      }
    }
    if (!improved) break;
  }
  const after = len(order);
  if (after >= before - 1e-9) return flat;
  return { order, before_m: before, after_m: after, gain_m: before - after };
}

/** Spots worth tacking on, given what is already in the day. Deterministic: same plan
    in, same list out, which is what makes this the application's job and not an
    agent's. */
function nearbySuggestions(stops, opts){
  const o = opts || {};
  const places = o.places || PLACES;
  const cats = o.cats || null;
  const planned = {};
  stops.forEach(s => { planned[s.id] = true; });
  const anchors = stops.map(s => s.place).filter(Boolean);
  if (!anchors.length) return [];
  const clusters = {}, catsIn = {};
  anchors.forEach(p => { clusters[p.cluster] = true; catsIn[p.cat] = true; });
  const out = [];
  places.forEach(q => {
    if (q.city !== o.city || planned[q.id] || q.cat === "hotel") return;
    if (cats && !cats[q.cat]) return;
    let d = Infinity, near = -1;
    anchors.forEach(a => {
      const t = hopMetres(a, q);
      if (t < d){ d = t; near = stops.findIndex(s => s.place === a); }
    });
    const inCluster = !!clusters[q.cluster];
    if (d > NEAR_RADIUS_M && !inCluster) return;
    const score = (1 - Math.min(1, d / NEAR_RADIUS_M))
      + (inCluster ? NEAR_CLUSTER_BONUS : -NEAR_NEW_CLUSTER_PENALTY)
      + (catsIn[q.cat] ? 0 : NEAR_VARIETY_BONUS)
      + (q.added ? NEAR_NEW_PLACE_BONUS : 0);
    // slot it next to the stop it is near, which is the whole point of suggesting it
    out.push({ place:q, d, score, nearIdx:near, insertAt: near < 0 ? stops.length : near + 1 });
  });
  out.sort((x, y) => y.score - x.score || x.d - y.d || (x.place.id < y.place.id ? -1 : 1));
  return out.slice(0, NEAR_MAX);
}

/** Everything the page can say about this order without guessing. */
function orderCautions(stops, city, day){
  const out = [];
  const unknown = stops.filter(s => !s.place);
  if (unknown.length) out.push({ kind:"unknown", text:
    `${unknown.length} stop${unknown.length > 1 ? "s" : ""} in this link ${unknown.length > 1 ? "are" : "is"} not in the map: ${unknown.map(s => s.id).join(", ")}.` });
  stops.forEach((s, i) => {
    if (s.place && s.place.city !== city) out.push({ kind:"city", i, text:
      `Stop ${i + 1}, ${s.place.name}, is in ${s.place.city} — this day is ${city}.` });
  });
  backtracks(stops).forEach(b => {
    const a = stops[b.i].place, c = stops[b.i + 1].place;
    out.push({ kind:"order", i:b.i, gain:b.gain, text:
      `Stops ${b.i + 1} and ${b.i + 2} look swapped — ${c.name} before ${a.name} saves about ${fmtM(b.gain)}.` });
  });
  const dow = planDow(day);
  if (dow) stops.forEach((s, i) => {
    if (s.place && closedDays(s.place.meta).indexOf(dow) >= 0) out.push({ kind:"closed", i, text:
      `${s.place.name} is shut on a ${DOW_LABEL[dow]} — the note says "${s.place.meta}".` });
  });
  // hardest problems first
  const rank = { unknown:0, city:1, closed:2, order:3 };
  return out.sort((a, b) => rank[a.kind] - rank[b.kind]);
}

/** The handoff. rideLine is an optional (place) -> string for the ride from the hotel,
    which lives outside this block because it needs the memoised journey engine. */
function planBriefMarkdown(plan, stops, href, rideLine, offFor){
  const st = planStats(stops, offFor), lines = [];
  const cityLabel = (LEGS.find(l => l.id === plan.city) || {}).label || plan.city;
  const head = [plan.title || "Day plan", "—", cityLabel].join(" ");
  lines.push(`# ${head}${plan.day ? ` · ${plan.day}` : ""}`);
  const bits = [`${st.resolved} stop${st.resolved === 1 ? "" : "s"}`];
  if (st.walkM) bits.push(`~${fmtM(st.walkM)} of walking between them`);
  if (st.rides) bits.push(`${st.rides} hop${st.rides === 1 ? "" : "s"} you would ride`);
  lines.push(bits.join(" · "));
  if (href) lines.push(`Source: ${href}`);
  lines.push("");
  stops.forEach((s, i) => {
    const p = s.place;
    if (!p){ lines.push(`${i + 1}. _unknown id \`${s.id}\`_`); lines.push(""); return; }
    const c = CATS[p.cat] || { label:p.cat, emoji:"" };
    lines.push(`${i + 1}. **${p.name}** — ${c.emoji} ${c.label} · ${p.cluster}`);
    lines.push(`   ${p.lat}, ${p.lng}`);
    if (p.note) lines.push(`   ${p.note}`);
    if (p.meta) lines.push(`   Check before you go: "${p.meta}"`);
    const ride = rideLine && rideLine(p);
    if (ride) lines.push(`   From the hotel: ${ride}`);
    const leg = st.legs[i];
    if (leg) lines.push(`   -> next: ${fmtM(leg.metres)}${leg.walkable ? `, about ${leg.walkMin} min on foot`
      : leg.line ? `, ${leg.line.label} from ${leg.line.from} to ${leg.line.to}` : `, ${leg.mode}`} · ${leg.naver}`);
    lines.push("");
  });
  const cautions = orderCautions(stops, plan.city, plan.day);
  if (cautions.length){
    lines.push("## Worth knowing");
    cautions.forEach(c => lines.push(`- ${c.text}`));
    lines.push("");
  }
  lines.push("## What this map does not know");
  lines.push("- How long any hop takes. Rail times between two stops are not computed anywhere:");
  lines.push("  the routing table only knows routes out from the hotel, so each hop carries a");
  lines.push("  Naver Maps link instead of an invented number.");
  lines.push("- Opening hours. Anything above in quotes is prose copied straight from the notes.");
  lines.push("- How busy anywhere is, or how long the queue runs.");
  return lines.join("\n");
}
/* ==== plan-core:end ==== */


/* ---------------- day plan: state, pane and overlay ---------------- */
/* Everything below here is allowed to touch the page. Everything above the
   plan-core:end sentinel is not — that is what keeps tools/test-plan.mjs honest. */

let plan = { city:"seoul", ids:[], day:"", title:"", extra:[] };
let planOver = 0;          // stops a too-long link had to drop, so the pane can say so
let sideTab = "places";
let placeQuery = "";
let planDragging = false, planRenderQueued = false, planDragFrom = -1;
let urlWritable = true, urlTimer = null, planFull = false;

/* place notes are ours, but a title arrives off the query string, so it is not */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const planHas = (id) => plan.ids.indexOf(id) >= 0;
const planStops = () => resolvePlan(plan.ids, PLACES);

/* offStationFor() gives a hotel nothing, because a hotel is where a ride starts rather
   than somewhere you ride to. A hop out of one still leaves from a platform, though. */
function planOffFor(p){
  return p.cat === "hotel" ? (p.city === "seoul" ? HOTEL_STATION : null) : offStationFor(p);
}

/** The ride from the hotel as plain text, for the brief. routeStripHtml() stays the
    one that speaks HTML; this one exists so neither has to serve two masters. */
function planHotelLine(p){
  const j = journeyFor(p);
  if (!j) return null;
  const hops = j.rail.map(l => `${l.label} to ${l.to}`).join(", then ");
  const walk = j.walk < 950 ? `${Math.round(j.walk / 10) * 10} m` : `${(j.walk / 1000).toFixed(1)} km`;
  return `${hops}${hops ? ", then " : ""}${walk} on foot, about ${j.minutes} min door to door`;
}

/* Debounced, because Safari throttles replaceState at 100 calls in 30 seconds and
   typing a title would spend that in a sentence. Wrapped, because file:// refuses it
   outright — losing the bookmarkable URL is a shame, not a reason to stop working. */
function syncPlanUrl(){
  if (!urlWritable) return;
  clearTimeout(urlTimer);
  urlTimer = setTimeout(() => {
    try {
      history.replaceState(null, "", encodePlanQuery(plan) || location.pathname);
    } catch (e){
      urlWritable = false;
      renderPlan();
    }
  }, 400);
}

function afterPlanChange(){
  syncPlanUrl();
  renderPlan();
  syncMarkers();
  drawRail();
  refreshPlanControls();
  const c = document.getElementById("planCount");
  if (c) c.textContent = plan.ids.length || "";
}

function planAdd(id, at){
  if (planHas(id)) return;
  if (plan.ids.length >= PLAN_MAX_STOPS){ planFull = true; renderPlan(); return; }
  planFull = false;
  const i = (at == null || at < 0 || at > plan.ids.length) ? plan.ids.length : at;
  plan.ids.splice(i, 0, id);
  afterPlanChange();
}
function planRemove(id){
  const i = plan.ids.indexOf(id);
  if (i < 0) return;
  plan.ids.splice(i, 1);
  planOver = 0; planFull = false;
  afterPlanChange();
}
function planToggle(id){ planHas(id) ? planRemove(id) : planAdd(id); }
function planMove(from, to){
  if (from === to || from < 0 || to < 0 || from >= plan.ids.length || to >= plan.ids.length) return;
  plan.ids.splice(to, 0, plan.ids.splice(from, 1)[0]);
  afterPlanChange();
}
function planReorder(order){
  plan.ids = order.map(i => plan.ids[i]);
  afterPlanChange();
}
function planClear(){
  plan.ids = [];
  afterPlanChange();
}

/** The add buttons are updated in place rather than by re-rendering the list: a
    re-render would throw away the list's scroll position and the search box's focus. */
function refreshPlanControls(){
  document.querySelectorAll("[data-plan-add]").forEach(b => {
    const on = planHas(b.dataset.planAdd);
    b.classList.toggle("on", on);
    b.textContent = on ? "✓" : "+";
    b.title = on ? "Remove from the day" : "Add to the day";
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const cp = document.getElementById("cardPlan");
  if (cp && selectedId){
    const on = planHas(selectedId);
    cp.classList.toggle("done", on);
    cp.textContent = on ? "✓ In the day" : "+ Add to the day";
  }
}

function setSideTab(t){
  sideTab = t;
  document.getElementById("side").dataset.sidetab = t;
  [["tabPlaces","places"],["tabPlan","plan"]].forEach(([id, v]) => {
    const b = document.getElementById(id);
    if (b){ b.classList.toggle("on", t === v); b.setAttribute("aria-pressed", t === v ? "true" : "false"); }
  });
  if (t === "plan") renderPlan();
}

/* ---------------- the plan pane ---------------- */

function planStopHtml(s, i, n){
  const p = s.place;
  const c = p ? (CATS[p.cat] || {}) : {};
  const body = p
    ? `<span class="pname">${p.name}</span>
       <span class="phood">${p.cluster}</span>
       ${p.note ? `<span class="pnote">${p.note}</span>` : ""}
       ${p.meta ? `<span class="pmetaline">${p.meta}</span>` : ""}`
    : `<span class="pname">unknown spot “${esc(s.id)}”</span>
       <span class="phood">this link names an id the map no longer has</span>`;
  return `<div class="pstop${p ? "" : " gone"}" data-i="${i}">
    <button class="pdrag" data-drag="${i}" title="Drag to reorder" aria-label="Drag to reorder">⠿</button>
    <span class="pnum-i" style="background:${p ? (c.color || "#888") : "#888"}">${i + 1}</span>
    <button class="pbody" data-focus="${p ? p.id : ""}">${body}</button>
    <span class="pctrl">
      <button class="pmove" data-up="${i}" ${i === 0 ? "disabled" : ""} title="Move up" aria-label="Move up">▲</button>
      <button class="pmove" data-down="${i}" ${i === n - 1 ? "disabled" : ""} title="Move down" aria-label="Move down">▼</button>
      <button class="pdrop" data-drop="${esc(s.id)}" title="Remove" aria-label="Remove">✕</button>
    </span>
  </div>`;
}

function planHopHtml(leg){
  if (!leg) return "";
  const how = leg.walkable
    ? `about ${leg.walkMin} min on foot`
    : (leg.mode === "car" ? "worth driving" : "worth riding");
  // named only where the geometry proves it: one line, both stations, no transfer guessed
  const line = leg.line
    ? `<span class="phop-l" style="--ln:${leg.line.color}">${leg.line.label}</span>
       <span class="phop-s">${leg.line.from} → ${leg.line.to}</span>`
    : "";
  return `<div class="phop"><span class="phop-r"></span>${fmtM(leg.metres)} · ${how}
    ${line}<a class="phop-a" href="${leg.naver}" target="_blank" rel="noopener noreferrer">Naver ↗</a></div>`;
}

function renderPlan(){
  // a re-render mid-drag would yank the row out from under the pointer
  if (planDragging){ planRenderQueued = true; return; }
  const el = document.getElementById("planpane");
  if (!el) return;
  const stops = planStops();
  const st = planStats(stops, planOffFor);
  const cautions = orderCautions(stops, plan.city, plan.day);
  const cityLabel = (LEGS.find(l => l.id === plan.city) || {}).label || plan.city;
  const out = [];

  const bits = [`<b>${st.resolved}</b> stop${st.resolved === 1 ? "" : "s"}`];
  if (st.walkM) bits.push(`${fmtM(st.walkM)} on foot`);
  if (st.rides) bits.push(`${st.rides} hop${st.rides === 1 ? "" : "s"} to ride`);
  out.push(`<div class="phead">
    <input class="ptitle" id="planTitle" placeholder="Name this day" maxlength="${PLAN_TITLE_MAX}" value="${esc(plan.title)}" />
    <input class="pdate" id="planDate" type="date" value="${esc(plan.day)}" aria-label="Date, used only to check weekday closures" />
    <div class="pmeta">${cityLabel} · ${bits.join(" · ")}</div>
  </div>`);

  if (!plan.ids.length){
    out.push(`<div class="pempty">Nothing planned yet.<br />Pick spots from the map or the Places tab and they land here, in order.</div>`);
  } else {
    out.push(`<div class="pacts">
      <button class="pact" id="planFit">Frame the day</button>
      <button class="pact" id="planBrief">Copy briefing</button>
      <button class="pact" id="planLink">Copy link</button>
      <button class="pact" id="planWipe">Clear</button>
    </div>`);
    if (planOver) out.push(`<div class="pcaution">That link named ${planOver} more stop${planOver > 1 ? "s" : ""} than a day holds, so the last ${planOver === 1 ? "one was" : "ones were"} left off. A day tops out at ${PLAN_MAX_STOPS}.</div>`);
    if (planFull) out.push(`<div class="pcaution">This day is full at ${PLAN_MAX_STOPS} stops. Drop one to add another.</div>`);
    if (!urlWritable) out.push(`<div class="pcaution">This browser will not let the page rewrite its address, so the link above is the one to copy by hand. Everything else works.</div>`);
    if (currentTab !== plan.city) out.push(`<div class="pcaution">This day is in ${cityLabel}, and you are looking at ${(LEGS.find(l => l.id === currentTab) || {}).label}. <button class="pcaution-fix" id="planGoCity">Show ${cityLabel}</button></div>`);

    cautions.forEach((c, k) => {
      const fix = c.kind === "order"
        ? `<button class="pcaution-fix" data-swap="${c.i}">Swap them</button>` : "";
      out.push(`<div class="pcaution ${c.kind}">${esc(c.text)}${fix}</div>`);
    });
    const ro = reorderByProximity(stops);
    if (ro.gain_m > SWAP_GAIN_M) out.push(`<div class="pcaution">
      Walked in a different order this day is about ${fmtM(ro.gain_m)} shorter.
      <button class="pcaution-fix" id="planReorder">Reorder by proximity</button></div>`);

    stops.forEach((s, i) => {
      out.push(planStopHtml(s, i, stops.length));
      out.push(planHopHtml(st.legs[i]));
    });
  }

  const sug = nearbySuggestions(stops, { places: PLACES, city: plan.city, cats: active });
  if (sug.length){
    out.push(`<div class="psec"><div class="psec-h">Nearby what you have</div></div>`);
    sug.forEach(s => {
      const c = CATS[s.place.cat] || {};
      const anchor = stops[s.nearIdx] && stops[s.nearIdx].place;
      out.push(`<button class="psug" data-suggest="${s.place.id}" data-at="${s.insertAt}">
        <span class="pindot" style="background:${c.color}">${c.emoji}</span>
        <span class="it-body">
          <span class="it-name">${s.place.name}</span>
          <span class="it-note">${s.place.note}</span>
          <span class="psug-d">${fmtM(s.d)} from ${anchor ? anchor.name : "your plan"}</span>
        </span></button>`);
    });
  }
  el.innerHTML = out.join("");
  wirePlanPane(el);
}

function wirePlanPane(el){
  const on = (sel, ev, fn) => el.querySelectorAll(sel).forEach(n => n.addEventListener(ev, fn));
  on("[data-focus]", "click", e => { const id = e.currentTarget.dataset.focus; if (id) focus(id); });
  on("[data-drop]", "click", e => planRemove(e.currentTarget.dataset.drop));
  on("[data-up]", "click", e => { const i = +e.currentTarget.dataset.up; planMove(i, i - 1); });
  on("[data-down]", "click", e => { const i = +e.currentTarget.dataset.down; planMove(i, i + 1); });
  on("[data-swap]", "click", e => { const i = +e.currentTarget.dataset.swap; planMove(i, i + 1); });
  on("[data-suggest]", "click", e => planAdd(e.currentTarget.dataset.suggest, +e.currentTarget.dataset.at));
  on("[data-drag]", "pointerdown", planDragStart);

  const t = el.querySelector("#planTitle");
  if (t) t.oninput = () => { plan.title = t.value.slice(0, PLAN_TITLE_MAX); syncPlanUrl(); };
  const d = el.querySelector("#planDate");
  if (d) d.onchange = () => { plan.day = d.value || ""; afterPlanChange(); };

  const wire = (id, fn) => { const b = el.querySelector("#" + id); if (b) b.onclick = fn; };
  wire("planFit", fitPlan);
  wire("planWipe", () => { if (!plan.ids.length || confirm("Clear this day?")) planClear(); });
  wire("planReorder", () => planReorder(reorderByProximity(planStops()).order));
  wire("planGoCity", () => setTab(plan.city));
  wire("planBrief", e => copyOut(e, planBriefMarkdown(plan, planStops(), planHref(), planHotelLine, planOffFor), "Briefing copied"));
  wire("planLink", e => copyOut(e, planHref(), "Link copied"));
}

function planHref(){
  return location.origin + location.pathname + encodePlanQuery(plan);
}

/* clipboard needs a secure context, which file:// is not — fall back to a selection
   the person can copy themselves rather than failing silently */
function copyOut(e, text, okLabel){
  const btn = e.currentTarget, was = btn.textContent;
  const done = () => { btn.textContent = okLabel; btn.classList.add("done");
    setTimeout(() => { btn.textContent = was; btn.classList.remove("done"); }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed; left:-9999px; top:0;";
  document.body.appendChild(ta);
  ta.select();
  let okd = false;
  try { okd = document.execCommand("copy"); } catch (e){ okd = false; }
  document.body.removeChild(ta);
  if (okd) done(); else window.prompt("Copy this:", text);
}

/* ---------------- dragging a stop ---------------- */

function planDragStart(e){
  const rows = [].slice.call(document.querySelectorAll("#planpane .pstop"));
  planDragFrom = +e.currentTarget.dataset.drag;
  if (planDragFrom < 0 || !rows.length) return;
  planDragging = true;
  e.currentTarget.setPointerCapture(e.pointerId);
  rows[planDragFrom].classList.add("dragging");
  const move = ev => {
    let to = rows.length - 1;
    for (let i = 0; i < rows.length; i++){
      const r = rows[i].getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2){ to = i; break; }
    }
    rows.forEach((r, i) => r.classList.toggle("dropbefore", i === to && i !== planDragFrom));
  };
  const end = ev => {
    document.removeEventListener("pointermove", move);
    ["pointerup","pointercancel","lostpointercapture"].forEach(k => document.removeEventListener(k, end));
    let to = -1;
    rows.forEach((r, i) => { if (r.classList.contains("dropbefore")) to = i; });
    rows.forEach(r => r.classList.remove("dragging", "dropbefore"));
    planDragging = false;
    const from = planDragFrom;
    planDragFrom = -1;
    if (to >= 0) planMove(from, to > from ? to - 1 : to);
    else if (planRenderQueued){ planRenderQueued = false; renderPlan(); }
  };
  document.addEventListener("pointermove", move);
  // all three, or a cancelled gesture leaves the pane frozen mid-drag
  ["pointerup","pointercancel","lostpointercapture"].forEach(k => document.addEventListener(k, end));
}

/* ---------------- the plan on the map ---------------- */

/* Nothing is drawn between the stops on the map, and nothing should be. A line from
   one stop to the next is a straight streak across a city that says nothing you can
   act on: ROUTES is rooted at the hotel, so there is no station-to-station geometry to
   trace, and a straight line is not a route, a walk, or a ride. The pins carry their
   own numbers once the rest of the map steps back, and the hop rows in the pane carry
   the distance, the line where the geometry proves one, and the Naver link — which is
   the part you can actually use. */
function fitPlan(){
  if (!map) return;
  const pts = planStops().filter(s => s.place).map(s => [s.place.lat, s.place.lng]);
  if (!pts.length) return;
  if (currentTab !== plan.city) setTab(plan.city);
  const pad = isMobile() ? 40 : 70;
  map.fitBounds(L.latLngBounds(pts), { padding: [pad, pad], maxZoom: 15, animate: false });
}

/* ---------------- boot ---------------- */

function bootPlan(){
  const got = decodePlanQuery(location.search, LEGS);
  plan = { city: got.city, ids: got.ids, day: got.day, title: got.title, extra: got.extra };
  planOver = got.over;
  currentTab = plan.city;
  const s = document.getElementById("search");
  if (s){
    s.oninput = () => {
      placeQuery = s.value;
      document.getElementById("searchClear").classList.toggle("on", !!placeQuery.trim());
      renderList();
    };
    s.onkeydown = e => { if (e.key === "Escape" && s.value){ e.stopPropagation(); s.value = ""; s.oninput(); } };
  }
  const sc = document.getElementById("searchClear");
  if (sc) sc.onclick = () => { s.value = ""; s.oninput(); s.focus(); };
  document.getElementById("tabPlaces").onclick = () => setSideTab("places");
  document.getElementById("tabPlan").onclick = () => setSideTab("plan");
  const c = document.getElementById("planCount");
  if (c) c.textContent = plan.ids.length || "";
  if (plan.ids.length) setSideTab("plan");
  renderPlan();
}

/* ---------------- tabs ---------------- */
function setTab(id){
  currentTab = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === id));
  deselect();
  renderLegend();
  renderList();
  drawRail();
  renderRailLegend();
  // switching city never discards a day; an empty plan just follows you
  if (!plan.ids.length) plan.city = id;
  renderPlan();
  syncMarkers();
  const hasRail = (RAIL[id] || []).length > 0;
  const rt = document.getElementById("railToggle");
  const rl = document.getElementById("raillegend");
  if (rt) rt.style.display = hasRail ? "" : "none";
  if (rl) rl.style.display = (hasRail && railOn) ? "" : "none";
  if (map) {
    syncMarkers();
    fitCity();
    // the box can still be the old size here (list view, a tab tapped mid-resize) — refit once it settles
    setTimeout(() => { if (map) { map.invalidateSize(); fitCity(); } }, 60);
  }
  if (isMobile()) {
    setView("map");
  }
}

/* ---------------- go ---------------- */
bootPlan();          // reads the link, so currentTab is right before anything renders
renderLegend();
renderList();

const nightBtn = document.getElementById("nightToggle");
if (nightBtn) nightBtn.onclick = () => {
  night = !night;
  document.body.classList.toggle("night", night);
  nightBtn.textContent = night ? "☀️ Day" : "🌙 Night";
  setBaseLayer();
  drawRail();
  // the casing under a drawn route is painted in the page background colour
  const sel = selectedId && PLACES.find(x => x.id === selectedId);
  if (sel && routeDraw) showRoute(sel);
};

const railBtn = document.getElementById("railToggle");
if (railBtn) railBtn.onclick = () => {
  railOn = !railOn;
  railBtn.classList.toggle("on", railOn);
  if (map && railLayer) { railOn ? railLayer.addTo(map) : map.removeLayer(railLayer); }
  const rl = document.getElementById("raillegend"); if (rl) rl.style.display = railOn ? "" : "none";
};
let railLegendOpen = false;
function applyRailLegendState(){
  const el = document.getElementById("raillegend"); if (!el) return;
  el.classList.toggle("collapsed", isMobile() && !railLegendOpen);
}
function renderRailLegend(){
  const el = document.getElementById("raillegend"); if (!el) return;
  el.innerHTML = '<div class="rl-h">Subway</div>' + (RAIL[currentTab]||[]).map(ln =>
    `<span class="rl-item"><span class="rl-bar" style="background:${ln.color}"></span>${ln.label}</span>`).join("");
  applyRailLegendState();
}
renderRailLegend();
const railLegendEl = document.getElementById("raillegend");
if (railLegendEl) railLegendEl.addEventListener("click", () => {
  if (!isMobile()) return;
  railLegendOpen = !railLegendOpen;
  applyRailLegendState();
});

document.addEventListener("keydown", e => { if (e.key === "Escape" && selectedId) deselect(); });

function libFail(){
  const b = document.getElementById("tilebanner");
  b.textContent = "The map library in vendor/leaflet didn’t load. The list, filters and notes still work.";
  b.style.display = "block";
}
function bootMap(){
  // Leaflet ships in this repo, so if it isn't here the file itself is broken — no CDN to retry.
  window.L ? initMap() : libFail();
}
bootMap();
</script>
